<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KMA Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: fixed 16:9 stage (1280Г—720 logical) scaled to the window, letterboxed on ink.
   Single deliberate look (a game world), colors set explicitly. */
:root{
  --ink:#141b2e;        /* ніч над Подолом: тло, діалоги */
  --ink-2:#222c47;
  --paper:#f7f4ee;      /* панелі, нотатник */
  --paper-2:#ebe5d8;
  --gold:#d9a21b;       /* мазепинське золото: акцент, бали */
  --gold-deep:#a8770a;
  --patina:#2f7d6d;     /* зелень бань: успіх, активні точки */
  --brick:#c2452d;      /* помилка, "бум" */
  --muted:#6b7286;
  --line:rgba(20,27,46,.14);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:#0b0f1b;color:var(--paper);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,#18203a 0%,#0b0f1b 70%)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none}
#stage canvas{position:absolute;inset:0;display:block}
#bg,#map{width:100%;height:100%} /* розмір на екрані не залежить від внутрішньої роздільності полотна */
button{font-family:var(--f-body);cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- small-screen notice ---------- */
#small{position:fixed;inset:0;z-index:99;display:none;place-items:center;padding:24px;text-align:center;background:var(--ink);color:var(--paper);font-size:16px;line-height:1.5}
#small b{font-family:var(--f-display);display:block;font-size:22px;margin-bottom:8px;color:var(--gold)}
@media (max-width:700px),(max-height:380px){#small{display:grid}}

/* ---------- NPC sprite ---------- */
#npc{position:absolute;left:50%;bottom:150px;width:330px;height:500px;transform:translateX(-50%);pointer-events:none;transition:opacity .45s, transform .45s}
#npc svg,#npc img{width:100%;height:100%;overflow:visible;object-fit:contain}
#npc.dissolve{opacity:0!important;filter:blur(10px);transform:translateX(-50%) scale(1.08);transition:all 1.6s}
#npc.off{opacity:0;transform:translateX(-50%) translateY(20px)}
#npc.ghost svg,#npc.ghost img{opacity:.62;filter:drop-shadow(0 0 22px rgba(170,220,255,.85));animation:flicker 3.2s infinite}
@keyframes flicker{0%,100%{opacity:.62}45%{opacity:.5}50%{opacity:.7}55%{opacity:.55}}
#npc.idle svg,#npc.idle img{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(3px) scaleY(.995)}}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:linear-gradient(180deg,rgba(11,15,27,.85),rgba(11,15,27,0));z-index:30;pointer-events:none}
#hud > *{pointer-events:auto}
#hud .score{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:96px;display:flex;align-items:center;gap:8px}
#hud .score small{font-family:var(--f-body);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(247,244,238,.6);font-weight:600}
#hud .chapter{flex:1;font-size:13px;letter-spacing:.06em;color:rgba(247,244,238,.85);font-weight:600;text-align:center}
.hbtn{height:34px;padding:0 14px;border-radius:17px;border:1px solid rgba(247,244,238,.25);background:rgba(20,27,46,.7);color:var(--paper);font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.hbtn:hover{border-color:var(--gold);color:#fff}
.hbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
#hud .plus{position:absolute;left:24px;top:46px;font-family:var(--f-display);font-weight:800;color:var(--gold);font-size:22px;pointer-events:none;animation:plus 1.4s ease-out forwards}
@keyframes plus{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}

/* ---------- Task checklist ---------- */
#tasks{position:absolute;left:16px;top:62px;width:268px;background:rgba(247,244,238,.96);color:var(--ink);border-radius:6px 14px 14px 6px;padding:14px 14px 12px;z-index:25;box-shadow:0 10px 30px rgba(0,0,0,.35);border-left:5px solid var(--gold);transition:transform .5s cubic-bezier(.2,.9,.3,1.2)}
#tasks.out{transform:translateX(-320px)}
#tasks h4{margin:0 0 8px;font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-deep)}
#tasks ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#tasks li button{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:13px;line-height:1.3;color:var(--ink)}
#tasks li button:hover:not(:disabled){border-color:var(--patina);background:#f2faf7}
#tasks li button:disabled{cursor:default;opacity:.55}
#tasks li .box{width:18px;height:18px;border-radius:5px;border:2px solid var(--muted);display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
#tasks li.done .box{background:var(--patina);border-color:var(--patina);color:#fff}
#tasks li.done .t{text-decoration:line-through;color:var(--muted)}
#tasks li.opt .t::after{content:" · необов'язково";color:var(--muted);font-size:11px}
#tasks li .t small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
#tasks .hint{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.35}

/* ---------- Dialog ---------- */
#dialog{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:1060px;min-height:150px;background:rgba(20,27,46,.95);border:1px solid rgba(217,162,27,.5);border-radius:14px;padding:26px 30px 18px;z-index:40;box-shadow:0 16px 40px rgba(0,0,0,.5);cursor:pointer}
#dialog .who{position:absolute;top:-16px;left:26px;background:var(--gold);color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:14px;padding:6px 14px;border-radius:8px;letter-spacing:.02em}
#dialog .who:empty{display:none}
#dialog .text{font-size:21px;line-height:1.5;color:var(--paper);min-height:64px;max-width:62em;text-wrap:pretty}
#dialog .text.small{font-size:15px;font-style:italic;color:rgba(247,244,238,.8)}
#dialog .text.narr{color:rgba(247,244,238,.85);font-style:italic}
#dialog .next{position:absolute;right:20px;bottom:14px;background:none;border:none;color:var(--gold);font-weight:700;font-size:15px;animation:nudge 1.2s infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
#dialog .choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#dialog .choices button{text-align:left;font-size:17px;padding:11px 16px;border-radius:10px;border:1px solid rgba(247,244,238,.25);background:rgba(247,244,238,.06);color:var(--paper);display:flex;gap:12px;align-items:center}
#dialog .choices button:hover{background:rgba(217,162,27,.18);border-color:var(--gold)}
#dialog .choices button kbd{font-family:var(--f-display);font-size:12px;color:var(--gold);border:1px solid rgba(217,162,27,.6);border-radius:5px;padding:2px 7px}
#dialog .choices button.wrong{border-color:var(--brick);background:rgba(194,69,45,.18);animation:shake .35s}
#dialog .choices button.right{border-color:var(--patina);background:rgba(47,125,109,.35)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.voice-tag{display:inline-block;margin-left:8px;font-size:11px;color:var(--gold);opacity:.8;font-style:normal;vertical-align:middle}

/* ---------- Layer / panels ---------- */
#layer{position:absolute;inset:0;z-index:50;pointer-events:none}
#layer > *{pointer-events:auto}
.veil{position:absolute;inset:0;background:rgba(8,11,20,.62);display:grid;place-items:center;animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
.panel{background:var(--paper);color:var(--ink);border-radius:16px;box-shadow:0 30px 70px rgba(0,0,0,.5);position:relative}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}
.panel .sub{color:var(--muted);font-size:14px;margin:0 0 16px;line-height:1.45}
.panel .close{position:absolute;right:14px;top:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;color:var(--ink)}
.btn{border:none;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:700;background:var(--ink);color:var(--paper);display:inline-flex;gap:8px;align-items:center}
.btn:hover{background:var(--ink-2)}
.btn.gold{background:var(--gold);color:var(--ink)}
a.btn{text-decoration:none;justify-content:center}
.btn.gold:hover{background:#e8b232}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold-deep)}
.feedback{min-height:22px;font-size:14px;line-height:1.4;margin-top:10px;font-weight:600}
.feedback.bad{color:var(--brick)}
.feedback.ok{color:var(--patina)}
.speaker-hint{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.45;min-height:44px}
.speaker-hint .av{width:36px;height:36px;border-radius:50%;flex:none;overflow:hidden;background:var(--paper-2)}
.speaker-hint .av svg,.speaker-hint .av img{width:100%;height:100%;object-fit:contain}
.speaker-hint b{display:block;font-size:12px;color:var(--gold-deep)}

/* ---------- Toast ---------- */
#toast{position:absolute;right:18px;top:62px;z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;box-shadow:0 10px 26px rgba(0,0,0,.35);border-left:4px solid var(--patina);animation:toast 3.6s forwards;max-width:340px}
.toast.word{border-left-color:var(--gold)}
.toast.word b{font-family:var(--f-display);color:var(--gold-deep)}
@keyframes toast{0%{opacity:0;transform:translateX(30px)}8%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10px)}}

/* ---------- Title card ---------- */
#card{position:absolute;inset:0;z-index:80;display:grid;place-items:center;background:var(--ink);opacity:0;pointer-events:none;transition:opacity .7s}
#card.on{opacity:1;pointer-events:auto}
#card .in{text-align:center}
#card .eyebrow{color:var(--gold);font-size:13px}
#card h1{font-family:var(--f-display);font-weight:800;font-size:54px;line-height:1.1;margin:14px 0 0;color:var(--paper);text-wrap:balance;max-width:980px}
#fade{position:absolute;inset:0;z-index:85;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
#fade.on{opacity:1}

/* ---------- Title screen ---------- */
.title-ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:56px;gap:20px}
.logo{text-align:center;animation:logo 4s ease-in-out infinite;position:absolute;top:70px;left:0;right:0}
.logo .k{font-family:var(--f-display);font-weight:800;font-size:96px;letter-spacing:-.03em;color:var(--paper);line-height:.9;text-shadow:0 6px 40px rgba(217,162,27,.45)}
.logo .k span{color:var(--gold)}
.logo .s{font-size:14px;letter-spacing:.38em;text-transform:uppercase;color:rgba(247,244,238,.75);margin-top:14px;font-weight:600}
@keyframes logo{50%{transform:scale(1.025)}}
.title-ui .menu{
  display:flex;
  gap:20px;
  transform:translateY(20px);
}
.title-ui .menu .btn{min-width:170px;justify-content:center;font-size:16px;padding:14px 22px}
.title-ui .menu .btn.ghost{color:var(--paper);border-color:rgba(247,244,238,.35);background:rgba(20,27,46,.6)}
.title-ui .foot{
  font-size:12px;
  color:rgba(247,244,238,.5);
  transform:translateY(8px);
}
.gate{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer;background:var(--ink);z-index:90}
.gate .in{text-align:center}
.gate .k{font-family:var(--f-display);font-weight:800;font-size:44px;color:var(--paper)}
.gate .k span{color:var(--gold)}
.gate p{color:rgba(247,244,238,.7);font-size:15px;margin-top:14px}
.gate .pulse{margin-top:28px;display:inline-block;padding:12px 26px;border-radius:30px;border:1px solid var(--gold);color:var(--gold);font-weight:700;animation:nudge 1.4s infinite}

/* ---------- Phone ---------- */
.phone{width:400px;height:660px;background:#0d111d;border-radius:44px;padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 2px #2b3350;position:relative}
.phone .scr{width:100%;height:100%;border-radius:32px;overflow:hidden;background:#e9eef5;display:flex;flex-direction:column;color:var(--ink)}
.phone .bar{height:64px;flex:none;background:#fff;display:flex;align-items:center;gap:10px;padding:18px 16px 0;border-bottom:1px solid #dde3ec}
.phone .bar .av{width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--paper-2);flex:none;display:grid;place-items:center;font-weight:800;font-size:13px}
.phone .bar .av svg,.phone .bar .av img{width:100%;height:100%;object-fit:contain}
.phone .bar b{font-size:15px;display:block}
.phone .bar small{font-size:11px;color:var(--muted)}
.phone .msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.msg{max-width:80%;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.4;background:#fff;align-self:flex-start;box-shadow:0 1px 1px rgba(0,0,0,.06);animation:pop .25s ease-out;word-wrap:break-word}
.msg .n{font-size:11px;font-weight:800;color:var(--patina);display:block;margin-bottom:2px}
.msg.me{align-self:flex-end;background:#d7f0e6}
.msg.sys{align-self:center;background:transparent;box-shadow:none;color:var(--muted);font-size:12px}
.msg.sticker{background:transparent;box-shadow:none;font-size:52px;padding:0;line-height:1}
.msg.typing{color:var(--muted);font-style:italic}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.phone .reply{flex:none;background:#fff;padding:10px;display:flex;flex-direction:column;gap:6px;border-top:1px solid #dde3ec;min-height:20px}
.phone .reply button{border:1px solid #cfd7e3;background:#f6f8fb;border-radius:14px;padding:9px 12px;font-size:13px;text-align:left;color:var(--ink)}
.phone .reply button:hover{border-color:var(--patina);background:#eef8f4}
.phone .notch{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:22px;background:#0d111d;border-radius:12px;z-index:2}

/* ---------- Profile / ticket ---------- */
.profile{width:900px;padding:30px 34px;display:grid;grid-template-columns:1fr 300px;gap:30px}
.profile .fields{display:flex;flex-direction:column;gap:14px;min-width:0}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid #cfc8b8;background:#fff;color:var(--ink)}
.field .err{font-size:12px;color:var(--brick);margin-top:4px;min-height:16px}
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avatars button{aspect-ratio:1;border-radius:12px;border:2px solid transparent;background:#fff;padding:2px;overflow:hidden}
.avatars button svg,.avatars button img{width:100%;height:100%;object-fit:contain}
.avatars button[aria-pressed="true"]{border-color:var(--gold);background:#fff7e3}
.preview{background:var(--ink);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:12px;position:relative;overflow:hidden}
.preview canvas{position:static!important;width:240px;height:300px}
.preview .lbl{color:rgba(247,244,238,.7);font-size:12px;margin-top:6px}
.ticket-wrap{width:560px;height:420px;position:relative;display:grid;place-items:start center}
.printer{width:600px;height:70px;background:#2b3350;border-radius:14px 14px 4px 4px;position:relative;z-index:2;box-shadow:0 10px 0 #1b2135}
.printer::after{content:"";position:absolute;left:40px;right:40px;bottom:10px;height:8px;background:#0b0f1b;border-radius:4px}
.ticket-clip{width:520px;height:330px;overflow:hidden;margin-top:-10px;position:relative}
.ticket{width:500px;height:310px;margin:0 auto;background:linear-gradient(135deg,#fdfbf6,#f2ead6);border-radius:12px;box-shadow:0 10px 20px rgba(0,0,0,.35);transform:translateY(-330px);padding:20px 22px;box-sizing:border-box;color:var(--ink);display:grid;grid-template-columns:120px 1fr;gap:18px;border-top:10px solid var(--patina);position:relative}
.ticket.print{animation:print 2.6s steps(26) forwards}
@keyframes print{to{transform:translateY(0)}}
.ticket .ph{width:120px;height:150px;background:var(--paper-2);border-radius:8px;overflow:hidden}
.ticket .ph svg,.ticket .ph img{width:100%;height:100%;object-fit:contain}
.ticket h3{margin:0;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--patina)}
.ticket .nm{font-family:var(--f-display);font-size:24px;font-weight:700;margin:6px 0 10px;line-height:1.1}
.ticket dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px}
.ticket dt{color:var(--muted)}
.ticket dd{margin:0;font-weight:600}
.ticket .num{position:absolute;right:20px;bottom:16px;font-size:11px;letter-spacing:.2em;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- Drag & drop ---------- */
.dd{width:1000px;padding:28px 32px}
.dd-grid{display:grid;grid-template-columns:260px 1fr;gap:28px;margin-top:4px}
.cards{display:flex;flex-direction:column;gap:10px;min-height:400px}
.card{background:var(--ink);color:var(--paper);border-radius:10px;padding:12px 14px;font-family:var(--f-display);font-weight:700;font-size:16px;cursor:grab;touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.25);position:relative;z-index:1}
.card.drag{cursor:grabbing;z-index:20;box-shadow:0 14px 30px rgba(0,0,0,.35);transition:none}
.card.back{transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.card.placed{background:var(--patina);cursor:default;box-shadow:none}
.slots{display:flex;flex-direction:column;gap:10px}
.slot{border:2px dashed #c7bfae;border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;min-height:30px;background:#fff;font-size:15px;line-height:1.35}
.slot .drop{min-height:30px;border-radius:8px;background:var(--paper-2);display:flex;align-items:center;font-family:var(--f-display);font-size:14px;font-weight:700;padding:4px 10px;color:var(--muted)}
.slot.hover{border-color:var(--gold);background:#fff9e8}
.slot.ok{border-style:solid;border-color:var(--patina)}
.slot.ok .drop{background:var(--patina);color:#fff}

/* timeline */
.tl{width:1120px;padding:26px 30px}
.tl-pool{display:flex;gap:10px;flex-wrap:wrap;min-height:120px;align-items:flex-start;margin:6px 0 18px}
.tl-pool .card{width:196px;font-family:var(--f-body);font-weight:600;font-size:13px;line-height:1.35;padding:10px 12px}
.tl-line{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;position:relative;padding-top:26px}
.tl-line::before{content:"";position:absolute;left:0;right:0;top:10px;height:4px;background:linear-gradient(90deg,var(--gold-deep),var(--gold));border-radius:2px}
.tl-line::after{content:"раніше → пізніше";position:absolute;right:0;top:-12px;font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;font-weight:700}
.tl-slot{min-height:110px;border:2px dashed #c7bfae;border-radius:10px;background:#fff;position:relative;display:flex;flex-direction:column;padding:6px}
.tl-slot::before{content:"";position:absolute;top:-22px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--gold-deep);transform:translateX(-50%)}
.tl-slot .yr{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--patina);text-align:center;min-height:24px}
.tl-slot.hover{border-color:var(--gold);background:#fff9e8}
.tl-slot .card{width:auto;font-family:var(--f-body);font-weight:600;font-size:13px;line-height:1.35;padding:10px 12px}
.tl-slot .card.locked{background:var(--patina);cursor:default}

.door:hover .plate.blank,.door:focus-visible .plate.blank{color:var(--ink);background:var(--paper)}
.door.top{top:12px}
.door.bot{bottom:0;transform:rotate(180deg)}

.video{position:absolute;inset:0;background:#000;z-index:60}

.saz .chatpop.docked{position:static;width:auto;max-height:none;box-shadow:none;border:1px solid #dfe3ec;margin:0 0 12px;flex-direction:row;flex-wrap:wrap;align-items:flex-start}
.saz .chatpop.docked .h{width:100%}
.saz .chatpop.docked .msg{max-width:none;flex:1 1 200px}
.saz .chatpop.docked .msg:not(:last-child){display:none}

/* library */
.catalog{width:900px;padding:26px 30px}
.catalog .search{display:flex;gap:8px;margin:10px 0}
.catalog .search input{flex:1;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid #cfc8b8}
.result{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.5;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.result dt{color:var(--muted)}

.shelves{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:12px}
.shelf{height:260px;border:none;border-radius:8px;background:#6b4a2b;padding:10px 10px 0;display:flex;flex-direction:column;gap:6px;position:relative;box-shadow:inset 0 0 0 6px #563820}

.about ul{padding-left:18px;margin:8px 0}

/* Звання — чиста функція від суми балів */
function rank(score) {
  for (const r of DATA.ranks) if (score >= r.min) return r;
  return DATA.ranks[DATA.ranks.length - 1];
}

/* =========================================================
   Основний звук — файли в assets/music, assets/sfx, assets/ambience.
   Синтез лишився як резерв. Файли озвучки — assets/voice.
   Шум для резервного синтезу генерується
   детермінованим ГПВЧ (seeded), без Math.random().
   ========================================================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
 
const Sound = (() => {
  let ctx = null, master, musicBus, sfxBus, ambBus, voiceBus;
  let enabled = true;
  let noiseBuf = null;
  const fileOk = {};          // name -> true/false (чи є файл)
  let music = null;           // {name, timer, nodes, el}
  let amb = null;
 
  const NOTE = { C: 0, "C#": 1, Db: 1, D: 2, "D#": 3, Eb: 3, E: 4, F: 5, "F#": 6, Gb: 6, G: 7, "G#": 8, Ab: 8, A: 9, "A#": 10, Bb: 10, B: 11 };
  function f(n) {
    const m = /^([A-G][#b]?)(\d)$/.exec(n);
    if (!m) return 0;
    const midi = NOTE[m[1]] + (parseInt(m[2]) + 1) * 12;
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { ctx = null; return; }
    master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
    musicBus = ctx.createGain(); musicBus.gain.value = 0.32; musicBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.6; sfxBus.connect(master);
    ambBus = ctx.createGain(); ambBus.gain.value = 0.35; ambBus.connect(master);
    voiceBus = ctx.createGain(); voiceBus.gain.value = 0.18; voiceBus.connect(master);
    const r = mulberry32(1615);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1;
    Object.keys(SFX).forEach(n => probe("assets/sfx/" + n + ".mp3", ok => { fileOk["sfx_" + n] = ok; }));
  }
 
  function tone(freq, t, dur, { type = "sine", gain = 0.2, dest = sfxBus, attack = 0.01, release = 0.08, detune = 0, slide = 0 } = {}) {
    if (!ctx || !freq) return;
    const o = ctx.createOscillator(), g = ctx.createGain();

    g.gain.setValueAtTime(0.0001, t);

    g.gain.setValueAtTime(gain, t + Math.max(attack, dur - release));

    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const g2 = ctx.createGain(); g2.gain.value = 0.25;
    o.connect(fl); o2.connect(g2); g2.connect(fl); fl.connect(g); g.connect(dest);

function drawChibi(ctx, a, x, y, dir = "down", phase = null, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const sw = phase !== null ? Math.sin(phase) * 4 : 0;
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(0, 4, 14, 6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = shade(a.cloth, .55); ctx.fillRect(-7, -10 + sw * .5, 5, 12); ctx.fillRect(2, -10 - sw * .5, 5, 12);
  ctx.fillStyle = a.cloth; rr(ctx, -11, -30, 22, 24, 8); ctx.fill();
  if (dir === "left" || dir === "right") { ctx.fillStyle = shade(a.cloth, .8); ctx.fillRect(dir === "left" ? -3 : -2, -26, 5, 16); }
  ctx.fillStyle = a.skin; ctx.beginPath(); ctx.arc(0, -40, 12, 0, 7); ctx.fill();
  ctx.fillStyle = a.hair;
  if (dir === "up") { ctx.beginPath(); ctx.arc(0, -41, 12.5, 0, 7); ctx.fill(); if (a.style === "ponytail") ctx.fillRect(-3, -36, 6, 12); }
  else {
    ctx.beginPath(); ctx.arc(0, -44, 12, Math.PI, 0); ctx.fill();
    if (a.style === "long" || a.style === "bob") { ctx.fillRect(-12, -44, 5, a.style === "long" ? 16 : 10); ctx.fillRect(7, -44, 5, a.style === "long" ? 16 : 10); }
    if (a.style === "curly") { ctx.beginPath(); ctx.arc(-9, -47, 6, 0, 7); ctx.arc(0, -51, 6, 0, 7); ctx.arc(9, -47, 6, 0, 7); ctx.fill(); }
    if (a.style === "ponytail" && dir !== "down") { ctx.fillRect(dir === "left" ? 8 : -14, -44, 6, 14); }
    ctx.fillStyle = "#2a1c16";
    if (dir === "down") { ctx.fillRect(-5, -40, 3, 4); ctx.fillRect(2, -40, 3, 4); }
    else ctx.fillRect(dir === "left" ? -7 : 4, -40, 3, 4);
  }
  ctx.restore();
}

const VO_FIXED = { "maryana|У КМА аудиторія записується як корпус-номер. Бачиш стовпець «тижні»? Деякі семінари йдуть не щотижня.": "maryana_sched" };
const VO = { log: [], seen: {}, videos: {} };
function voKey(who, raw) {
  const s = (who || "narr") + "|" + raw; let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return "auto/" + h.toString(16).padStart(8, "0");
}
function voFor(who, raw) {
  raw = String(raw || "").trim(); if (!raw || !who || who === "me" || !DATA.npc[who]) return null;
  const fixed = VO_FIXED[(who || "narr") + "|" + raw]; if (fixed) return fixed;
  const id = voKey(who, raw);
  if (Q.has("collect") && !VO.seen[id]) { VO.seen[id] = 1; VO.log.push({ id, who: who || null, text: raw }); }
  return id;
}

/* ---------- Stage scaling ---------- */
let SCALE = 1;
function fit() {
  const st = $("#stage");
  SCALE = Math.min(innerWidth / W, innerHeight / H);
  st.style.transform = `translate(-50%,-50%) scale(${SCALE})`;
  st.style.transformOrigin = "50% 50%";
}
addEventListener("resize", fit);
/* Чіткість: гра масштабується на весь екран, тож canvas із текстом малюємо з роздільністю екрана (а не лише 1280×720). */
function resQ() { return Math.min(3, Math.max(1, Math.ceil((SCALE || 1) * (window.devicePixelRatio || 1) * 4) / 4)); }
function hiRes(cv, w, h) { const q = resQ(); cv.width = Math.round(w * q); cv.height = Math.round(h * q); const x = cv.getContext("2d"); x.scale(q, q); return x; }

/* ---------- Background loop ---------- */
let bgFn = BG.blank, bgT0 = 0, bgImg = null, bgName = "";
const bgFiles = {};
function setBg(name) {
  bgName = name; bgFn = BG[name] || BG.blank; bgT0 = performance.now(); bgImg = null;
  // Святковий двір має анімовані кульки/прапорці, тому не підміняємо Canvas статичним WebP.
  if (name === "yardFest") return;
  const url = "assets/img/bg_" + name + ".webp";
  if (bgFiles[url] === false) return;
  if (bgFiles[url]) { bgImg = bgFiles[url]; return; }
  const im = new Image();
  im.onload = () => { bgFiles[url] = im; if (bgName === name) bgImg = im; };
  im.onerror = () => { bgFiles[url] = false; };
  im.src = url;
}
let bgDim = 0;
function bgLoop(now) {
  const c = $("#bg"), q = resQ();
  if (c.width !== Math.round(W * q)) { c.width = Math.round(W * q); c.height = Math.round(H * q); }
  const ctx = c.getContext("2d"); ctx.setTransform(q, 0, 0, q, 0, 0);
  const t = (now - bgT0) / 1000;
  if (bgImg) ctx.drawImage(bgImg, 0, 0, W, H); else bgFn(ctx, t);
  if (bgDim > 0) { ctx.fillStyle = `rgba(10,14,30,${bgDim})`; ctx.fillRect(0, 0, W, H); }
  requestAnimationFrame(bgLoop);
}

/* ---------- Dialog ---------- */
function speakerName(who) { if (!who) return ""; if (who === "me") return S.player.name || "Я"; const n = DATA.npc[who]; return n ? n.name : who; }
const TYPE_STEP = 3;          // символів за крок для тексту без озвучки
const SILENT_VIDEO_SPEED = 1.5; // відео без голосу йдуть швидше
const TYPING = new Map();     // тексти, що зараз друкуються: завершити -> час старту
let dialogAdvance = null;     // перехід до наступної репліки, поки вона на екрані
function typeInto(el, text, who, voiceId) {
  return new Promise(res => {
    const npc = DATA.npc[who] || {};
    if (FAST) { el.textContent = text; res(() => {}); return; }
    let i = 0, done = false; el.textContent = "";
    const t0 = performance.now();
    const show = n => { n = Math.max(i, Math.min(text.length, n)); if (n !== i) { i = n; el.textContent = text.slice(0, i); } };
    const end = () => { if (done) return; done = true; TYPING.delete(end); clearInterval(iv); el.textContent = text; res(); };
    // з озвучкою: текст іде синхронно з аудіо (скільки програно — стільки видно)
    const synced = () => {
      if (!voiceId || !Sound.enabled) return false;
      if (Sound.voiceQueued(voiceId)) return performance.now() - t0 < 30000 ? "wait" : false;
      const st = Sound.voiceState(voiceId);
      if (st === undefined) return performance.now() - t0 < 2600 ? "wait" : false;
      if (st !== true) return false;
      const au = Sound.voiceAudio();
      if (!au || !au.src.endsWith("/" + voiceId + ".mp3")) return false;
      if (!isFinite(au.duration) || au.duration <= 0) return "wait";
      if (au.ended) return "end";
      if (au.paused && au.currentTime === 0) return performance.now() - t0 < 1500 ? "wait" : false; // автозапуск заблоковано
      return au.currentTime / (au.duration * 0.92); // текст трохи випереджає кінець фрази
    };
    const iv = setInterval(() => {
      const k = synced();
      if (k === "wait") return;
      if (k === "end") { end(); return; }
      if (k !== false) { show(Math.ceil(text.length * Math.min(1, k))); return; } // кінець — лише коли голос договорив
      // без озвучки — кілька символів за крок і «біпи»
      show(i + TYPE_STEP);
      if (who && text[i - 1] && text[i - 1] !== " ") Sound.blip(npc.pitch || 1, npc.whisper);
      if (i >= text.length) end();
    }, 22);
    el._finish = end; TYPING.set(end, t0);
  });
}
// Клік будь-де на сцені: перший показує весь текст, наступний переходить далі. Кнопки й поля працюють як зазвичай.
$("#stage").addEventListener("click", e => {
  if (e.target.closest("button:not(.next), a, input, select, textarea, label")) return;
  const fresh = [...TYPING].filter(([, t0]) => t0 <= e.timeStamp); // клік, що сам запустив репліку, не рахується
  if (fresh.length) { fresh.forEach(([finish]) => finish()); return; }
  if (!TYPING.size && dialogAdvance) dialogAdvance();
});
/** Репліка. who: id NPC / "me" / null (оповідач). */
async function say(who, text, o = {}) {
  o = Object.assign({}, o); if (o.voice === undefined) o.voice = voFor(who, text);
  text = tpl(text);
  const d = $("#dialog"), tx = $(".text", d), ch = $(".choices", d), nx = $(".next", d);
  if (o.sprite !== false && CHAR[who]) showNPC(who, o.emo || "neutral");
  d.hidden = false; ch.innerHTML = ""; nx.hidden = true;
  $(".who", d).textContent = speakerName(who);
  tx.className = "text" + (o.small ? " small" : "") + (!who ? " narr" : "");
  if (o.voice) Sound.voice(o.voice); else Sound.stopVoice();
  let typing = true;
  const p = typeInto(tx, text, who, o.voice);
  if (o.voice) { const tag = document.createElement("span"); tag.className = "voice-tag"; tag.textContent = "🔊 озвучено"; p.then(() => setTimeout(() => { if (Sound.hasVoice(o.voice) && tx.isConnected) tx.appendChild(tag); }, 300)); }
  return new Promise(res => {
    const advance = () => {
      if (typing) { tx._finish && tx._finish(); return; }
      const au = Sound.voiceAudio(); if (o.voice && au && au._id === o.voice) Sound.stopVoice(); // пропуск репліки
      cleanup(); Sound.sfx("click"); res();
    };
    const pop = pushKeys(e => { if (e.key === " " || e.key === "Enter") { advance(); return true; } });
    const cleanup = () => { dialogAdvance = null; pop(); };
    dialogAdvance = advance;
    p.then(() => { typing = false; nx.hidden = false; if (o.auto) setTimeout(() => { if (!d.hidden) advance(); }, o.auto); });
  });
}
/** Вибір варіанта. Повертає індекс. */
async function choose(options, o = {}) {
  const d = $("#dialog"), tx = $(".text", d), ch = $(".choices", d), nx = $(".next", d);
  d.hidden = false; nx.hidden = true; ch.innerHTML = "";
  if (o.text !== undefined) {
    $(".who", d).textContent = speakerName(o.who);
    if (o.who && CHAR[o.who] && o.sprite !== false) showNPC(o.who, o.emo || "neutral");
    tx.className = "text" + (!o.who ? " narr" : "");
    const vid = o.voice || voFor(o.who, o.text); if (vid) Sound.voice(vid); else Sound.stopVoice();
    const popType = pushKeys(e => { if (e.key === " " || e.key === "Enter") { tx._finish && tx._finish(); return true; } });
    await typeInto(tx, tpl(o.text), o.who, vid);
    popType();
  }
  return new Promise(res => {
    options.forEach((t, i) => {
      const b = document.createElement("button");
      b.innerHTML = `<kbd>${i + 1}</kbd><span>${esc(tpl(t))}</span>`;
      if (TEST && o.correct !== undefined && i === o.correct) b.dataset.ok = "1";
      b.addEventListener("click", ev => { ev.stopPropagation(); pick(i); });
      ch.appendChild(b);
    });
    const pop = pushKeys(e => { const n = parseInt(e.key); if (n >= 1 && n <= options.length) { pick(n - 1); return true; } });
    function pick(i) { pop(); Sound.sfx("click"); const btns = $$("button", ch); res({ i, btn: btns[i], btns }); }
  }).then(r => r);
}
/** Вибір із правильною відповіддю: повтор до успіху, бали 1-ша спроба / далі. */
async function askScored(who, text, options, correct, o = {}) {
  let tries = 0;
  while (true) {
    const r = await choose(options, { who, text: tries ? (o.retryText || text) : text, correct, emo: o.emo });
    if (r.i === correct) {
      r.btn.classList.add("right"); Sound.sfx("ok");
      if (o.key) award(o.key, tries === 0 ? (o.pts ? o.pts[0] : 10) : (o.pts ? o.pts[1] : 5));
      await sleep(500);
      if (o.ok) await say(who, o.ok, { emo: "happy", voice: o.okVoice });
      return tries;
    }
    tries++;
    r.btn.classList.add("wrong"); Sound.sfx("err");
    await sleep(450);
    const w = Array.isArray(o.wrong) ? (o.wrong[r.i] || o.wrong[0]) : o.wrong;
    if (w) await say(o.wrongWho || who, w, { emo: "surprised", voice: o.wrongVoice && o.wrongVoice[r.i] });
  }
}

/* ---------- Шрифти ----------
   document.fonts.ready повертається одразу, якщо жоден шрифт ще не запитано, тож canvas-тексти
   (фони, карта, сертифікат) малювалися запасним шрифтом і так і лишалися в кеші.
   Тому завантажуємо потрібні накреслення явно (з кирилицею) і скидаємо кеші, коли шрифти з'явилися. */
const FONT_FACES = ["500 16px Manrope", "600 16px Manrope", "700 16px Manrope", "800 16px Manrope", "500 16px Unbounded", "700 16px Unbounded", "800 16px Unbounded"];
function resetFontCaches() { for (const k in staticCache) delete staticCache[k]; if (typeof MapView !== "undefined") MapView.invalidate(); }
async function loadFonts() {
  if (!document.fonts) return;
  const load = Promise.all(FONT_FACES.map(f => document.fonts.load(f, "АаБбЇїЄєІіҐґЯя Aa0 ·")));
  try { await Promise.race([load, new Promise(r => setTimeout(r, 8000))]); await document.fonts.ready; } catch (e) {}
  resetFontCaches();
}
if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", resetFontCaches);

/* ---------- Confetti (seeded) ---------- */
function confetti(ms = 3500) {
  const c = document.createElement("canvas"); c.width = W; c.height = H; c.style.zIndex = 75; c.style.pointerEvents = "none";
  $("#stage").appendChild(c);
  const ctx = c.getContext("2d"), r = mulberry32(1991);
  const cols = ["#d9a21b", "#2f7d6d", "#c2452d", "#3e5aa8", "#ffd500", "#0057b8", "#f7f4ee"];
  const P = Array.from({ length: 160 }, () => ({ x: r() * W, y: -r() * 400, vx: (r() - .5) * 120, vy: 120 + r() * 220, s: 6 + r() * 8, a: r() * 6, va: (r() - .5) * 8, c: cols[(r() * cols.length) | 0] }));
  const t0 = performance.now(); Sound.sfx("pop");
  (function f(now) {
    const dt = 1 / 60, el = now - t0;
    ctx.clearRect(0, 0, W, H);
    P.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - Math.max(0, el - ms + 800) / 800); ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (el < ms) requestAnimationFrame(f); else c.remove();
  })(t0);
}

/* ---------- Video (canvas-кліп або MP4 зі слоту) ---------- */
/** subs: [[від, до, текст], ...] у секундах. draw(ctx, t, dur). */
function playVideo({ id, dur, draw, subs = [], skippable = true, vertical = false, voice }) {
  return new Promise(res => {
    const v = openLayer(`<canvas width="${vertical ? 405 : W}" height="720"></canvas><div class="subs"><span></span></div>
      <div class="ctl"><span class="tag">${vertical ? "сторіс" : "відео"} · субтитри</span>${skippable ? `<button class="skip" id="vskip">Пропустити ▸▸</button>` : ""}</div><div class="prog"></div>`, "video" + (vertical ? " vertical" : ""));
    const cv = $("canvas", v), ctx = hiRes(cv, vertical ? 405 : W, 720), sub = $(".subs span", v), prog = $(".prog", v);
    const speed = FAST ? 40 : voice ? 1 : SILENT_VIDEO_SPEED;
    let t0 = performance.now(), done = false, videoEl = null, lastSub = -1;
    if (voice) Sound.voice(voice); else Sound.stopVoice();
    const finish = () => { if (done) return; done = true; pop(); Sound.stopVoice(); if (videoEl) videoEl.pause(); closeLayer(v); res(); };
    const pop = pushKeys(e => { if (skippable && (e.key === "Escape" || e.key === "Enter")) { finish(); return true; } });
    if (skippable) $("#vskip", v).addEventListener("click", finish);
    // MP4 слот
    if (id && !FAST) {
      const vid = document.createElement("video"); vid.playsInline = true; vid.src = "assets/video/" + id + ".mp4";
      vid.addEventListener("loadeddata", () => { if (done) return; videoEl = vid; cv.replaceWith(vid); vid.playbackRate = speed; vid.play().catch(() => {}); vid.onended = finish; }, { once: true });
      vid.addEventListener("error", () => {}, { once: true });
    }
    (function loop(now) {
      if (done) return;
      const t = videoEl ? videoEl.currentTime : (now - t0) / 1000 * speed;
      if (!videoEl) draw(ctx, t, dur);
      prog.style.width = Math.min(100, t / dur * 100) + "%";
      const k = subs.findIndex(s => t >= s[0] && t < s[1]);
      if (k !== lastSub) { lastSub = k; sub.textContent = k >= 0 ? tpl(subs[k][2]) : ""; sub.style.display = k >= 0 ? "" : "none"; }
      if (t >= dur && !videoEl) { finish(); return; }
      requestAnimationFrame(loop);
    })(t0);
  });
}

/* ---------- Drag & drop helper (pointer events, працює зі scale) ---------- */
function draggable(card, { targets, onDrop }) {
  card.addEventListener("pointerdown", e => {
    if (card.classList.contains("placed") || card.classList.contains("locked")) return;
    e.preventDefault(); card.setPointerCapture(e.pointerId);
    const sx = e.clientX, sy = e.clientY;
    card.classList.add("drag"); card.classList.remove("back");
    let over = null;
    const move = ev => {
      card.style.transform = `translate(${(ev.clientX - sx) / SCALE}px,${(ev.clientY - sy) / SCALE}px) rotate(-2deg)`;
      const hit = targets().find(t => { const r = t.getBoundingClientRect(); return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom; });
      if (over !== hit) { over && over.classList.remove("hover"); over = hit; over && over.classList.add("hover"); }
    };
    const up = () => {
      card.removeEventListener("pointermove", move); card.removeEventListener("pointerup", up); card.removeEventListener("pointercancel", up);
      card.classList.remove("drag"); over && over.classList.remove("hover");
      const accepted = over ? onDrop(card, over) : false;
      if (!accepted) { card.classList.add("back"); card.style.transform = ""; }
    };
    card.addEventListener("pointermove", move); card.addEventListener("pointerup", up); card.addEventListener("pointercancel", up);
  });
}

const MAP_PAL = {

// Трамвай їде реальною колією: позиція вздовж ламаної, спрайт повертається за напрямком руху.

    }
    for (let k = 0; k < (isHover ? 2 : 1); k++) {
      const ph = (t * (isHover ? 1.1 : 0.6) + k * 0.5) % 1, e = 6 + ph * (isHover ? 26 : 18);
      ctx.globalAlpha = (isHover ? 0.8 : 0.3) * (1 - ph); ctx.strokeStyle = "#f2b600"; ctx.lineWidth = isHover ? 3 : 2;
      ctx.beginPath(); ctx.ellipse(cx, cy, ax + e, ay + e, 0, 0, 7); ctx.stroke();
    }
    ctx.restore();
  }

  function drawLabel(ctx, p, st, t, isHover) {
    if (p.spawnOnly) return;
    const locked = st === "locked";
    const baseline = p.labelY ?? (p.y - 18);
    ctx.save();
    if (isHover) { ctx.translate(p.x, baseline); ctx.scale(1.14, 1.14); ctx.translate(-p.x, -baseline); }
    ctx.font = "800 11px Manrope, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const label = p.name;
    const width = Math.max(54, ctx.measureText(label).width + 18);
    const boxY = baseline - 13;
    ctx.shadowColor = "rgba(0,0,0,.25)";
    ctx.shadowBlur = 7;
    ctx.fillStyle = locked ? "rgba(70,76,85,.92)" : "rgba(20,27,46,.91)";
    rr(ctx, p.x - width / 2, boxY, width, 26, 8); ctx.fill();
    ctx.shadowBlur = 0;
    if (isHover) { ctx.strokeStyle = "#f2b600"; ctx.lineWidth = 2.5; rr(ctx, p.x - width / 2, boxY, width, 26, 8); ctx.stroke(); }
    ctx.fillStyle = locked ? "#e1e1e1" : "#fffaf0";
    ctx.fillText((locked ? "🔒 " : "") + label, p.x, baseline);

    if (p.subtitle) {
      ctx.font = "800 9px Manrope, sans-serif";
      const subW = ctx.measureText(p.subtitle).width + 14;
      const subY = baseline + 17;
      ctx.fillStyle = st === "done" ? "#2f7d6d" : "#d9a21b";
      rr(ctx, p.x - subW / 2, subY - 9, subW, 18, 6); ctx.fill();
      ctx.fillStyle = "#141b2e";
      ctx.fillText(p.subtitle, p.x, subY);
    }

    const markerY = boxY - 19 + (st === "active" ? Math.sin(t * 4) * 3 : 0);
    if (st === "active") {
      ctx.fillStyle = "#f2b600"; ctx.beginPath(); ctx.arc(p.x, markerY, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#141b2e"; ctx.font = "900 16px Unbounded, sans-serif"; ctx.fillText("!", p.x, markerY + 1);
    } else if (st === "done") {
      ctx.fillStyle = "#2f7d6d"; ctx.beginPath(); ctx.arc(p.x, markerY, 11, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "900 13px Manrope, sans-serif"; ctx.fillText("✓", p.x, markerY + 1);
    } else if (st === "icon") {
      ctx.fillStyle = "#2f7d6d"; ctx.beginPath(); ctx.arc(p.x, markerY, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "900 12px Manrope, sans-serif"; ctx.fillText("★", p.x, markerY + 1);
    }
    ctx.restore();
  }

  // Підказка біля курсора на місці, куди можна піти.
  function drawTip(ctx, p, st) {
    const nearIt = Math.hypot(hero.x - p.tx, hero.y - p.ty) < 30;
    const txt = st === "locked" ? "🔒 Відкриється пізніше" : nearIt ? "Клік — зайти" : "Клік — піти сюди";
    ctx.save(); ctx.font = "700 12px Manrope, sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    const w = ctx.measureText(txt).width + 20, x = Math.min(W - w - 8, mouse.x + 16), y = Math.min(H - 24, mouse.y + 22);
    ctx.shadowColor = "rgba(0,0,0,.3)"; ctx.shadowBlur = 8;
    ctx.fillStyle = "#f2b600"; rr(ctx, x, y - 12, w, 24, 12); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = "#141b2e"; ctx.fillText(txt, x + 10, y + 1); ctx.restore();
  }

  // Єдиний хіт-тест для наведення й кліку: будівля/зона або підпис.
  function pointAt(x, y) {
    let best = null, bd = Infinity;
    for (const p of MAP_POINTS) {
      if (p.spawnOnly || stateFn(p.id) === "hidden") continue;
      const [rx, ry, rw, rh] = p.hit, half = Math.max(27, p.name.length * 3.4 + 9), ly = p.labelY ?? p.y;
      const onBox = x >= rx - 8 && x <= rx + rw + 8 && y >= ry - 8 && y <= ry + rh + 8;
      const onLabel = !p.stand && Math.abs(x - p.x) <= half && Math.abs(y - ly) <= 14;
      if (!onBox && !onLabel) continue;
      const d = onLabel ? Math.hypot(x - p.x, y - ly) : Math.hypot(x - (rx + rw / 2), y - (ry + rh / 2));
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  }

  function drawStand(ctx, p, st) {
    if (!p.stand || st === "hidden") return;
    const x = p.x, y = p.y;
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fillRect(x - 3, y - 2, 6, 30);
    ctx.fillStyle = "#d9a21b"; rr(ctx, x - 28, y - 28, 56, 25, 5); ctx.fill();
    ctx.fillStyle = "#172039"; ctx.font = "800 10px Manrope, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("СО", x, y - 15);
    ctx.restore();
  }

  function drawHero(ctx) {
    drawChibi(ctx, AVATARS[avatar] || AVATARS[0], hero.x, hero.y, hero.dir, hero.moving ? hero.phase : null, 0.55);
  }

  const blocked = mapBlocked;

  function cellCenter(cx, cy) { return { x: cx * GRID + GRID / 2, y: cy * GRID + GRID / 2 }; }
  function nearestWalkableCell(x, y) {
    const cols = Math.ceil(W / GRID), rows = Math.ceil(H / GRID);
    const sx = Math.max(0, Math.min(cols - 1, Math.floor(x / GRID)));
    const sy = Math.max(0, Math.min(rows - 1, Math.floor(y / GRID)));
    for (let radius = 0; radius <= 8; radius++) {
      for (let dy = -radius; dy <= radius; dy++) for (let dx = -radius; dx <= radius; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== radius) continue;
        const cx = sx + dx, cy = sy + dy;
        if (cx < 0 || cy < 0 || cx >= cols || cy >= rows) continue;
        const p = cellCenter(cx, cy);
        if (!blocked(p.x, p.y)) return { cx, cy };
      }
    }
    return null;
  }

  // A* для кліку по карті: персонаж обходить корпуси, а не впирається в них.
  function findPath(from, to) {
    const cols = Math.ceil(W / GRID), rows = Math.ceil(H / GRID);
    const start = nearestWalkableCell(from.x, from.y);
    const goal = nearestWalkableCell(to.x, to.y);
    if (!start || !goal) return [to];
    const key = (x, y) => y * cols + x;
    const point = id => ({ cx: id % cols, cy: Math.floor(id / cols) });
    const startId = key(start.cx, start.cy), goalId = key(goal.cx, goal.cy);
    // Прохідність клітинок рахуємо один раз (карта нерухома), відкритий список — бінарна купа.
    if (!walkGrid) { walkGrid = new Uint8Array(cols * rows); for (let i = 0; i < walkGrid.length; i++) { const c = cellCenter(i % cols, Math.floor(i / cols)); walkGrid[i] = blocked(c.x, c.y) ? 0 : 1; } }
    const free = (x, y) => x >= 0 && y >= 0 && x < cols && y < rows && walkGrid[y * cols + x] === 1;
    const came = new Map();
    const heuristic = (x, y) => { const dx = Math.abs(goal.cx - x), dy = Math.abs(goal.cy - y); return 14 * Math.min(dx, dy) + 10 * (Math.max(dx, dy) - Math.min(dx, dy)); };
    const gScore = new Map([[startId, 0]]);
    const heap = [[heuristic(start.cx, start.cy), startId]];
    const push = n => { heap.push(n); let i = heap.length - 1; while (i) { const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
    const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };
    const dirs = [[1,0,10],[-1,0,10],[0,1,10],[0,-1,10],[1,1,14],[1,-1,14],[-1,1,14],[-1,-1,14]];
    const closed = new Uint8Array(cols * rows);
    let found = false;
    while (heap.length) {
      const [, current] = pop();
      if (closed[current]) continue; closed[current] = 1;
      if (current === goalId) { found = true; break; }
      const c = point(current);
      for (const [dx, dy, cost] of dirs) {
        const nx = c.cx + dx, ny = c.cy + dy;
        if (!free(nx, ny)) continue;
        if (dx && dy && (!free(c.cx + dx, c.cy) || !free(c.cx, c.cy + dy))) continue;
        const nid = key(nx, ny), tentative = gScore.get(current) + cost;
        if (tentative < (gScore.get(nid) ?? Infinity)) {
          came.set(nid, current); gScore.set(nid, tentative);
          push([tentative + heuristic(nx, ny), nid]);
        }
      }
    }
    if (!found) return [to];
    const ids = [goalId];
    while (ids[0] !== startId) {
      const prev = came.get(ids[0]);
      if (prev == null) break;
      ids.unshift(prev);
    }
    const result = ids.slice(1).map(id => { const c = point(id); return cellCenter(c.cx, c.cy); });
    const finalPoint = blocked(to.x, to.y) ? cellCenter(goal.cx, goal.cy) : to;
    if (!result.length || Math.hypot(result[result.length - 1].x - finalPoint.x, result[result.length - 1].y - finalPoint.y) > 5) result.push(finalPoint);
    return result;
  }

  function renderPrompt() {
    if (!promptEl) return;
    if (!near || insideLock === near.id) { promptEl.hidden = true; return; }
    const st = stateFn(near.id);
    promptEl.hidden = false;
    promptEl.innerHTML = st === "locked"
        ? `🔒 ${esc(near.name)} — відкриється у Главі 4`
        : `<kbd>E</kbd> Увійти: ${esc(near.name)}`;
  }

  function enter(id) {
    const st = stateFn(id);
    const p = MAP_POINTS.find(x => x.id === id);
    if (st === "locked" || st === "hidden") {
      Sound.sfx("err"); toast("🔒 " + (p?.name || "Ця локація") + " відкриється у Главі 4");
      return;
    }
    if (!resolver) return;
    const r = resolver; resolver = null; insideLock = id; near = null; renderPrompt();
    r(id.startsWith("girkyi") ? "girkyi" : id); // три «Гіркі» — одне й те саме місце для сюжету
  }

  function frame(now) {
    if (!active) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const t = now / 1000;
    let dx = 0, dy = 0;
    const uiBusy = $("#layer").childElementCount > 0 || !$("#dialog").hidden || !resolver;
    if (uiBusy) {
      Object.keys(keys).forEach(k => keys[k] = false);
      for (const k in tapped) delete tapped[k];
      path = []; target = null; autoEnter = null;
    }
    const K = k => keys[k] || tapped[k];
    if (!uiBusy) {
      if (K("ArrowLeft") || K("a") || K("ф")) dx -= 1;
      if (K("ArrowRight") || K("d") || K("в")) dx += 1;
      if (K("ArrowUp") || K("w") || K("ц")) dy -= 1;
      if (K("ArrowDown") || K("s") || K("і") || K("ы")) dy += 1;
    }
    for (const k in tapped) delete tapped[k];
    if (dx || dy) { path = []; target = null; autoEnter = null; }
    else if (!uiBusy && path.length) {
      const wp = path[0], vx = wp.x - hero.x, vy = wp.y - hero.y, d = Math.hypot(vx, vy);
      if (d < 5) {
        hero.x = wp.x; hero.y = wp.y; path.shift();
        if (!path.length && autoEnter) { const id = autoEnter; autoEnter = null; target = null; enter(id); }
      } else { dx = vx / d; dy = vy / d; }
    }
    hero.moving = !!(dx || dy);
    if (hero.moving) {
      const len = Math.hypot(dx, dy), sp = (path.length ? 170 : 160) * dt;
      const nx = hero.x + dx / len * sp, ny = hero.y + dy / len * sp;
      if (!blocked(nx, hero.y)) hero.x = nx;
      if (!blocked(hero.x, ny)) hero.y = ny;
      hero.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down");
      hero.phase += dt * 14;
    }

    let n = null, best = 30;
    for (const p of MAP_POINTS) {
      if (p.spawnOnly || stateFn(p.id) === "hidden") continue;
      const d = Math.hypot(hero.x - p.tx, hero.y - p.ty);
      if (d < best) { best = d; n = p; }
    }
    if (insideLock && (!n || n.id !== insideLock)) insideLock = null;
    if (n !== near) { near = n; renderPrompt(); }

    hover = !uiBusy && mouse ? pointAt(mouse.x, mouse.y) : null;
    cv().style.cursor = hover ? "pointer" : "default";
    if (introEl && introUntil && now > introUntil) { introEl.hidden = true; introUntil = 0; }
    const mc = cv(), q = resQ();
    if (mc.width !== Math.round(W * q)) { mc.width = Math.round(W * q); mc.height = Math.round(H * q); }
    const ctx = mc.getContext("2d"); ctx.setTransform(q, 0, 0, q, 0, 0);
    drawMapBase(ctx);
    drawMovingTram(ctx, dt);
    // Однотонна смуга під інформаційною колонкою: карта не просвічує.
    ctx.fillStyle = "#13233a";
    ctx.fillRect(0, 0, 300, H);
    const pts = MAP_POINTS.filter(p => !p.spawnOnly && stateFn(p.id) !== "hidden").sort((a, b) => a.y - b.y);
    for (const p of pts) drawHalo(ctx, p, stateFn(p.id), t, p === hover);
    let heroDrawn = false;
    for (const p of pts) {
      if (!heroDrawn && hero.y < p.y) { drawHero(ctx); heroDrawn = true; }
      drawStand(ctx, p, stateFn(p.id));
      if (p !== hover) drawLabel(ctx, p, stateFn(p.id), t, false);
    }
    if (!heroDrawn) drawHero(ctx);
    if (hover) drawLabel(ctx, hover, stateFn(hover.id), t, true);
    if (hover && mouse) drawTip(ctx, hover, stateFn(hover.id));
    if (target) {
      ctx.strokeStyle = "rgba(217,162,27,.95)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(target.x, target.y, 9 + Math.sin(t * 6) * 2, 0, Math.PI * 2); ctx.stroke();
    }
    if (dusk > 0) { ctx.fillStyle = `rgba(40,30,90,${dusk * 0.55})`; ctx.fillRect(0, 0, W, H); }
    requestAnimationFrame(frame);
  }

  function normalizeId(id) { return MAP_ALIASES[id] || id; }
  function onKey(e) {
    if (!active) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (e.type === "keydown") {
      if ($("#layer").childElementCount > 0) return;
      if ((k === "e" || k === "у" || k === "Enter" || k === " ") && near && resolver) { enter(near.id); e.preventDefault(); return; }
      keys[k] = true; tapped[k] = true;
      if (k.startsWith("Arrow")) e.preventDefault();
    } else keys[k] = false;
  }
  addEventListener("keydown", onKey); addEventListener("keyup", onKey);
  addEventListener("blur", () => Object.keys(keys).forEach(k => keys[k] = false));

  function onMove(e) {
    const r = cv().getBoundingClientRect();
    mouse = { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  function onClick(e) {
    if (!active || !resolver || $("#layer").childElementCount > 0) return;
    const r = cv().getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
    if (introEl) { introEl.hidden = true; introUntil = 0; }
    const p = pointAt(x, y);
    if (p && Math.hypot(hero.x - p.tx, hero.y - p.ty) < 30) { enter(p.id); return; }
    const destination = p ? { x: p.tx, y: p.ty } : { x, y };
    path = findPath(hero, destination);
    target = destination;
    autoEnter = p ? p.id : null;
  }

  function ensurePanels() {
    if (!promptEl) {
      promptEl = document.createElement("div"); promptEl.className = "mapprompt"; promptEl.hidden = true; $("#stage").appendChild(promptEl);
      helpEl = document.createElement("div"); helpEl.className = "maphelp"; helpEl.textContent = "🖱 Наведи на місце й клікни — персонаж піде сам · також WASD / стрілки · E — увійти"; $("#stage").appendChild(helpEl);
      introEl = document.createElement("div"); introEl.className = "mapintro"; introEl.hidden = true;
      introEl.innerHTML = "<b>Як тут ходити</b>Наведи курсор на корпус чи заклад — він засвітиться. Клікни, і персонаж сам дійде й зайде всередину.";
      $("#stage").appendChild(introEl);
      sidebarEl = document.createElement("div"); sidebarEl.className = "map-sidebar";
      $("#stage").appendChild(sidebarEl);
      legendEl = document.createElement("aside"); legendEl.className = "map-legend"; legendEl.innerHTML = MAP_LEGEND_HTML; legendEl.hidden = true;
      sidebarEl.appendChild(legendEl);
    }
  }

  return {
    show(fn, opts = {}) {
      stateFn = id => fn(id.startsWith("girkyi") ? "girkyi" : id); avatar = S.player.avatar || 0;
      const c = cv(); c.hidden = false;
      if (!c._bound) { c.addEventListener("click", onClick); c.addEventListener("mousemove", onMove); c.addEventListener("mouseleave", () => { mouse = null; }); c._bound = true; }
      ensurePanels();
      $("#stage").classList.add("map-open");
      sidebarEl.appendChild($("#tasks"));
      sidebarEl.hidden = false;
      helpEl.hidden = false; legendEl.hidden = false;
      if (!introShown) { introShown = true; introEl.hidden = false; introUntil = performance.now() + 14000; }
      if (opts.from) {
        const id = normalizeId(opts.from), p = MAP_POINTS.find(p => p.id === id);
        if (p) {
          hero.x = p.tx; hero.y = p.ty; // точка входу завжди на доріжці
          hero.dir = "down"; insideLock = id;
        }
      }
      if (!active) { active = true; last = performance.now(); requestAnimationFrame(frame); }
      renderPrompt();
    },
    wait() { return new Promise(r => { resolver = r; renderPrompt(); }); },
    cancelWait() { resolver = null; path = []; target = null; autoEnter = null; renderPrompt(); },
    hide() {
      active = false; const c = cv(); c.hidden = true;
      if (promptEl) promptEl.hidden = true;
      if (helpEl) helpEl.hidden = true;
      if (introEl) introEl.hidden = true;
      mouse = null; hover = null;
      if (legendEl) legendEl.hidden = true;
      if (sidebarEl) sidebarEl.hidden = true;
      $("#stage").classList.remove("map-open");
      // За межами карти звичайна панель завдань має бути на старому місці.
      const tasks = $("#tasks");
      if (tasks && tasks.parentElement !== $("#stage")) $("#stage").appendChild(tasks);
      resolver = null; target = null; path = []; autoEnter = null; near = null;
      Object.keys(keys).forEach(k => keys[k] = false);
    },
    refresh() { renderPrompt(); },
    invalidate() { baseCache = null; },
    set dusk(v) { dusk = v; },
    get hero() { return hero; },
    get isActive() { return active; },
    get waiting() { return !!resolver; },
    stateOf(id) { return stateFn ? stateFn(normalizeId(id)) : null; },
    enterForTest(id) { if (resolver) { const r = resolver; resolver = null; insideLock = normalizeId(id); r(normalizeId(id)); } },
    prerender() { const c = document.createElement("canvas"); c.width = W; c.height = H; drawMapBase(c.getContext("2d")); return c; },
    reset() { hero = { x: MAP_GEO.spawn[0], y: MAP_GEO.spawn[1], dir: "up", phase: 0, moving: false }; target = null; path = []; autoEnter = null; near = null; insideLock = null; }
  };
})();

/* ---------- Телефон / чат ---------- */
function phoneOpen({ title, sub = "", av = "" }) {
  const v = openLayer(`<div class="phone"><div class="notch"></div><div class="scr">
    <div class="bar"><div class="av">${av}</div><div><b>${esc(tpl(title))}</b><small>${esc(tpl(sub))}</small></div></div>
    <div class="msgs"></div><div class="reply"></div></div></div>`);
  const msgs = $(".msgs", v), reply = $(".reply", v);
  const api = {
    el: v,
    add(text, o = {}) {
      const m = document.createElement("div");
      m.className = "msg" + (o.me ? " me" : "") + (o.sys ? " sys" : "") + (o.sticker ? " sticker" : "");
      m.innerHTML = (o.from && !o.me ? `<span class="n">${esc(o.from)}</span>` : "") + esc(tpl(text));
      msgs.appendChild(m); msgs.scrollTop = msgs.scrollHeight;
      if (!o.me && !o.sys && !o.silent) Sound.sfx("notif");
      return m;
    },
    async typing(from, ms = 900) { const m = api.add("друкує…", { sys: true }); m.classList.add("typing"); await chatWait(ms); m.remove(); },
    replies(opts, correct) {
      return new Promise(res => {
        reply.innerHTML = "";
        opts.forEach((t, i) => { const b = document.createElement("button"); b.textContent = tpl(t); if (TEST && i === correct) b.dataset.ok = "1"; b.onclick = () => { Sound.sfx("click"); reply.innerHTML = ""; res(i); }; reply.appendChild(b); });
      });
    },
    button(label) { return new Promise(res => { reply.innerHTML = ""; const b = document.createElement("button"); b.textContent = label; b.style.textAlign = "center"; b.style.fontWeight = "700"; b.dataset.ok = "1"; b.onclick = () => { reply.innerHTML = ""; res(); }; reply.appendChild(b); }); },
    close() { closeLayer(v); }
  };
  return api;
}

/* ---------- 1.2 Сленг-перекладач ---------- */
function slangGame() {
  return new Promise(res => {
    const words = DATA.slang.words, byId = Object.fromEntries(words.map(w => [w.id, w]));
    const v = openLayer(`<div class="panel dd"><div class="eyebrow">Глава 1 · міні-гра</div><h2>Сленг-перекладач</h2>

function panelQuiz(root, items, { who, keyPrefix, onDone, qSel = ".qz" }) {
  return new Promise(res => {
    const box = $(qSel, root);
    let qi = 0;
    const render = () => {
      const it = items[qi]; let tries = 0;
      box.innerHTML = `<div class="quiz" style="width:auto;padding:0"><div class="prog">${items.map((_, i) => `<i class="${i <= qi ? "on" : ""}"></i>`).join("")}</div>
        <div class="q">${esc(tpl(it.q))}</div><div class="opts">${it.o.map((o, i) => `<button data-i="${i}" ${TEST && i === it.a ? 'data-ok="1"' : ""}><kbd>${i + 1}</kbd>${esc(o)}</button>`).join("")}</div><div class="feedback"></div></div>`;
      const fb = $(".feedback", box), qEl = $(".q", box), qid = voFor(who || null, it.q);
      Sound.voice(qid, { queue: true }); typeInto(qEl, tpl(it.q), null, qid);
      $$(".opts button", box).forEach(b => b.addEventListener("click", () => {
        const i = +b.dataset.i;
        if (i === it.a) {
          b.classList.add("right"); $$(".opts button", box).forEach(x => x.disabled = true);
          award(keyPrefix + qi, tries ? 5 : 10); Sound.sfx("ok");
          fb.className = "feedback ok"; fb.textContent = it.ok || "Правильно!";
          if (who) setHint(root, who, it.ok || "Так, усе правильно!", "happy");
          setTimeout(() => { qi++; if (qi < items.length) render(); else { onDone && onDone(); res(); } }, FAST ? 10 : 1100);
        } else {
          tries++; b.classList.add("wrong"); b.disabled = true; Sound.sfx("err");
          fb.className = "feedback bad"; fb.textContent = it.why || "Не зовсім. Спробуй ще раз.";
          if (who) setHint(root, who, it.why || "Спробуй ще раз.", "surprised");

      }));
    };
    render();
  });
}

    for (let i = 0; i < 22; i++) { ctx.fillStyle = i % 2 ? "#c2452d" : "#2b2b2b"; const x = i * 32; ctx.beginPath(); ctx.moveTo(x, 260); ctx.lineTo(x + 16, 244); ctx.lineTo(x + 32, 260); ctx.lineTo(x + 16, 276); ctx.fill(); }
    ctx.fillStyle = "#f7f4ee"; ctx.fillRect(0, 290, w, 80);

    ctx.fillStyle = "#9ec3d6"; ctx.fillRect(0, 140, w, 230);
    ctx.fillStyle = "rgba(255,255,255,.35)"; for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(i * 150, 370); ctx.lineTo(i * 150 + 60, 140); ctx.lineTo(i * 150 + 90, 140); ctx.lineTo(i * 150 + 30, 370); ctx.fill(); }
    ctx.fillStyle = "#f08a24"; rr(ctx, 380, 170, 300, 80, 10); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "800 54px Unbounded, sans-serif"; ctx.textAlign = "left"; ctx.fillText("СІЛ…", 400, 230);
  }
  ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(0, 0, w, h); // "фото" тон
}

        if (byId[id].cr !== fullCr()) { stepCourses(`«${byId[id].c}» має ${byId[id].cr} кр., а «${byId[fullId].c}» мав ${fullCr()}. Сума буде ${credits() + byId[id].cr + (plan.filter(p => p !== fullId && !enrolled.includes(p)).reduce((a, p) => a + byId[p].cr, 0))}, а треба 30.`); Sound.sfx("err"); return; }

function standTrack(club, cv) {
  const st = { started: false };
  if (club.voice) { Sound.voice(club.voice, { queue: true }); cv.addEventListener("click", () => Sound.voice(club.voice)); }
  st.get = () => {
    if (!club.voice || !Sound.enabled) return { real: false, playing: true, t: null };
    const au = Sound.voiceAudio(), mine = au && au._id === club.voice;
    if (mine) st.started = true;
    if (!mine) return { real: st.started, playing: false, waiting: !st.started && Sound.voiceQueued(club.voice), t: st.started ? Infinity : 0 };
    return { real: true, playing: !au.paused && !au.ended, t: au.currentTime };
  };
  return st;
}

function nightToMorning() {
  return new Promise(res => {
    const c = document.createElement("canvas"); c.width = W; c.height = H; c.style.zIndex = 55; $("#stage").appendChild(c);
    const ctx = c.getContext("2d"), t0 = performance.now(), D = FAST ? 100 : 3200;
    const mix = (a, b, k) => { const pa = a.match(/\w\w/g).map(h => parseInt(h, 16)), pb = b.match(/\w\w/g).map(h => parseInt(h, 16)); return "rgb(" + pa.map((v, i) => Math.round(v + (pb[i] - v) * k)).join(",") + ")"; };
    Sound.stopAmb(); Sound.sfx("bells"); // ранок 1 вересня: Київ прокидається під дзвони
    (function f(now) {
      const k = Math.min(1, (now - t0) / D);
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, mix("0a0f22", "8fc3e8", k)); g.addColorStop(1, mix("27325a", "ffd9a0", k)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#ffcf5a"; ctx.beginPath(); ctx.arc(640, 640 - k * 380, 70, 0, 7); ctx.fill();
      ctx.fillStyle = mix("0d1326", "c9bfae", k); ctx.fillRect(0, 560, W, 160);
      ctx.fillStyle = "#fff"; ctx.font = "800 40px Unbounded, sans-serif"; ctx.textAlign = "center"; ctx.globalAlpha = Math.min(1, k * 2); ctx.fillText(k < 0.5 ? "Ніч перед першим днем…" : "Ранок. 1 вересня", 640, 200); ctx.globalAlpha = 1;
      if (k < 1) requestAnimationFrame(f); else setTimeout(() => { c.remove(); res(); }, FAST ? 0 : 600);
    })(t0);
  });
}

function unfoldMap() {
  return new Promise(res => {
    const c = document.createElement("canvas"); c.width = W; c.height = H; c.style.zIndex = 55; $("#stage").appendChild(c);
    const ctx = c.getContext("2d"), t0 = performance.now(), D = FAST ? 80 : 2200;
    const src = MapView.prerender();
    Sound.sfx("paper");
    (function f(now) {
      const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3);
      ctx.fillStyle = "#141b2e"; ctx.fillRect(0, 0, W, H);
      const w = 120 + (W - 160) * Math.min(1, e * 1.6), h = 60 + (H - 100) * Math.max(0, (e - .3) / .7);

      ctx.fillStyle = "#efe6cf"; ctx.fillRect(-w / 2 - 8, -h / 2 - 8, w + 16, h + 16);

      ctx.strokeStyle = "rgba(0,0,0,.18)"; ctx.lineWidth = 2; for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-w / 2 + w * i / 4, -h / 2); ctx.lineTo(-w / 2 + w * i / 4, h / 2); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.lineTo(w / 2, 0); ctx.stroke();
      ctx.restore();
      if (k < 1) requestAnimationFrame(f); else setTimeout(() => { c.remove(); res(); }, FAST ? 0 : 400);
    })(t0);
  });
}

function confettiDust() {
  const c = document.createElement("canvas"); c.width = W; c.height = H; c.style.zIndex = 45; c.style.pointerEvents = "none"; $("#stage").appendChild(c);
  const ctx = c.getContext("2d"), r = mulberry32(1817), t0 = performance.now();
  const P = Array.from({ length: 140 }, () => ({ x: 520 + r() * 240, y: 120 + r() * 420, vx: (r() - .3) * 60, vy: -20 - r() * 70, s: 1 + r() * 3 }));
  (function f(now) { const el = (now - t0) / 1000; ctx.clearRect(0, 0, W, H); P.forEach(p => { ctx.fillStyle = `rgba(190,225,255,${Math.max(0, 1 - el / 2)})`; ctx.beginPath(); ctx.arc(p.x + p.vx * el, p.y + p.vy * el, p.s, 0, 7); ctx.fill(); }); if (el < 2) requestAnimationFrame(f); else c.remove(); })(t0);
}

async function ch4() {

/* ---------- ФІНАЛ ---------- */
function finalCutscene() {
  const im = id => svgImage("f_" + id, npcSVG(id, "happy"));
  const ids = ["guard", "dana", "olga", "skovoroda", "maryana", "president"]; ids.forEach(im);
  const av = svgImage("f_av" + (S.player.avatar || 0), charSVG(AVATARS[S.player.avatar || 0], "happy"));
  let confettiDone = false;
  return playVideo({ id: "final", dur: 45, voice: "final", skippable: true,
    subs: [[1, 6, "Петрович киває: «Молодець, першокурснику»"], [7, 12, "Дана махає телефоном: «Ти в чатику — назавжди»"], [13, 18, "Пані Ольга усміхається: «ІНП без жодної помилки»"], [19, 24, "У вікні Староакадемічного майорить Сковорода"],
      [25, 31, "Мар'яна: «Ти більше не фреш-новачок. Тебе хочуть бачити…»"], [32, 40, "Президент Академії: «{name}, ви пройшли шлях, який проходить кожен могилянець. Вітаю в Академії — тепер це і ваш дім»."], [40.5, 45, "Вручення сертифіката"]],
    draw(ctx, t) {
      ctx.save(); const pan = Math.min(1, t / 24); ctx.translate(-pan * 180, 0); ctx.scale(1.15, 1.15); BG.yardFest(ctx, t); ctx.restore();
      const seg = [[0, 6, "guard", 300], [6, 12, "dana", 520], [12, 18, "olga", 760], [24, 32, "maryana", 640], [32, 45, "president", 760]];
      seg.forEach(([a, b, id, x]) => { if (t >= a && t < b) { const k = Math.min(1, (t - a) / .6), out = Math.max(0, (t - b + .6) / .6); ctx.globalAlpha = Math.max(0, k - out); const bob = id === "guard" ? Math.abs(Math.sin(t * 3)) * 10 : id === "dana" ? Math.sin(t * 8) * 4 : 0; ctx.drawImage(im(id), x - 150, 260 + bob, 300, 460); ctx.globalAlpha = 1; if (id === "dana") { ctx.save(); ctx.translate(x + 120, 420); ctx.rotate(Math.sin(t * 8) * .4); ctx.fillStyle = "#141b2e"; rr(ctx, -18, -34, 36, 64, 6); ctx.fill(); ctx.restore(); } } });
      if (t >= 18 && t < 24) { ctx.globalAlpha = .55 + Math.sin(t * 5) * .1; ctx.drawImage(im("skovoroda"), 860, 150, 160, 245); ctx.globalAlpha = 1; }
      if (t >= 32) { ctx.drawImage(av, 220, 300, 270, 414); }
      if (t >= 40) { const k = Math.min(1, (t - 40) / 1.5); ctx.save(); ctx.translate(500 + 100 * (1 - k), 470); ctx.rotate(-0.1); ctx.fillStyle = "#f7f4ee"; ctx.fillRect(-90, -60, 180, 120); ctx.strokeStyle = "#d9a21b"; ctx.lineWidth = 5; ctx.strokeRect(-82, -52, 164, 104); ctx.fillStyle = "#141b2e"; ctx.font = "800 16px Unbounded, sans-serif"; ctx.textAlign = "center"; ctx.fillText("СЕРТИФІКАТ", 0, 0); ctx.restore(); }
      if (t >= 41 && !confettiDone) { confettiDone = true; confetti(3800); Sound.sfx("applause"); }
    } });
}

async function certificateScreen() {
  setBg("yardFest"); showHUD(true); setChapter("Фінал · сертифікат"); hideNPC(); hideDialog(); hideTasks(); MapView.hide();
  Sound.startMusic("theme_triumph");
  const url = await makeCertificate();
  const r = rank(score());
  const fname = "KMA-Quest-" + S.player.name.replace(/[^\wа-яіїєґ'-]/gi, "_") + ".png";
  const v = openLayer(`<div class="panel cert"><div><img src="${url}" alt="Сертифікат ${esc(S.player.name)}"></div>
    <div class="side"><div class="eyebrow">Твоє звання</div><div class="rank">${esc(r.title)}</div><div class="pts">${score()} балів з 380 · штампів СО: ${S.stamps.length} з 4</div>
    ${hintBox("maryana", r.line)}
    <a class="btn gold" href="${url}" download="${esc(fname)}" id="dl">⬇ Завантажити сертифікат</a>
    <p class="note">Якщо завантаження не почалося, клацни правою кнопкою на сертифікаті → «Зберегти зображення як…».</p>
    <button class="btn ghost" id="nb">Відкрити Нотатник фреша</button>
    <button class="btn ghost" id="cr">Титри</button>
    <button class="btn" id="again">Грати ще раз</button></div></div>`);
  $("#dl", v).onclick = async e => {
    Sound.sfx("ok");
    if (!window.claude || !window.claude.use) return; // звичайне завантаження за посиланням
    e.preventDefault();
    const fallback = "Клацни правою кнопкою на сертифікаті → «Зберегти зображення як…».";
    try {
      const d = await window.claude.use("downloads");
      if (!d) { toast(fallback); return; }
      const bin = atob(url.split(",")[1]), arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      await d.save({ filename: fname, data: new Blob([arr], { type: "image/png" }) });
      toast("Сертифікат збережено");
    } catch (err) { if (!err || err.code !== "declined") toast("Не вдалося зберегти. " + fallback); }
  };
  $("#nb", v).onclick = () => openNotebook();
  $("#cr", v).onclick = () => credits();
  return new Promise(res => { $("#again", v).onclick = () => { closeLayer(v); storeDel(SAVE_KEY); S = freshState(); res("restart"); }; });
}
function credits() {
  return new Promise(res => {
    Sound.startMusic("theme_campus");
    const v = openLayer(`<canvas width="${W}" height="${H}"></canvas><div class="roll"><div class="big">KMA Quest</div><p>Квест для першокурсників Могилянки</p>
      ${DATA.credits.map(([a, b]) => `<h3>${esc(a)}</h3><p>${Array.isArray(b) ? b.map(esc).join("<br>") : esc(b)}</p>`).join("")}<h3>Дякуємо, що зіграли</h3><p class="big" style="font-size:40px">${esc(S.player.name || "")}, ласкаво просимо додому</p></div>
      <div class="ctl"><button class="skip" id="cx" style="background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:18px;padding:7px 16px">Закрити</button></div>`, "credits");
    const ctx = $("canvas", v).getContext("2d"); let run = true; const t0 = performance.now();
    (function f(now) { if (!run) return; BG.yardDay(ctx, (now - t0) / 1000); requestAnimationFrame(f); })(t0);
    const close = () => { run = false; closeLayer(v); Sound.startMusic("theme_triumph"); res(); };
    $("#cx", v).onclick = close; setTimeout(() => { if (run) close(); }, FAST ? 100 : 36000);
  });
}

/* ---------- Запуск ---------- */
async function runFrom(scene) {
  const idx = ORDER.indexOf(scene);
  const at = k => idx <= ORDER.indexOf(k);
  if (at("prologue")) await prologue();
  if (at("ch1")) await ch1Intro();
  if (at("ch1_hub")) await ch1Hub();
  if (at("ch2")) await ch2();
  if (at("ch3")) await ch3();
  if (at("ch3_hub")) await ch3Hub();
  if (at("ch4")) await ch4();
  if (at("club")) await clubScene();
  if (at("final")) await final();
  else if (scene === "done") await certificateScreen();
}
async function boot() {
  fit(); requestAnimationFrame(bgLoop);
  $("#snd").onclick = () => { Sound.setEnabled(!Sound.enabled); updateHUD(); };
  $("#nbBtn").onclick = () => openNotebook();
  setBg("title_test");
  await loadFonts();
  if (!TEST) await gate(); else Sound.init();
  while (true) {
    const scene = await titleScreen();
    await runFrom(scene);
    hideTasks(); hideDialog(); hideNPC(); MapView.hide(); $("#layer").innerHTML = "";
  }
}
window.__kma = { get S() { return S; }, score, rank, enter: id => MapView.enterForTest(id), solve: () => window.__solve && window.__solve(), task: id => { if (taskResolver) { const r = taskResolver; taskResolver = null; r(id); } } };
boot();
