<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KMA Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: fixed 16:9 stage (1280×720 logical) scaled to the window, letterboxed on ink.
   Single deliberate look (a game world), colors set explicitly. */
:root{
  --ink:#141b2e;        /* ніч над Подолом: тло, діалоги */
  --ink-2:#222c47;
  --paper:#f7f4ee;      /* панелі, нотатник */
  --paper-2:#ebe5d8;
  --gold:#d9a21b;       /* мазепинське золото: акцент, бали */
  --gold-deep:#a8770a;
  --patina:#2f7d6d;     /* зелень бань: успіх, активні точки */
  --brick:#c2452d;      /* помилка, "бум" */
  --muted:#6b7286;
  --line:rgba(20,27,46,.14);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:#0b0f1b;color:var(--paper);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,#18203a 0%,#0b0f1b 70%)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none}
#stage canvas{position:absolute;inset:0;display:block}
button{font-family:var(--f-body);cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
 
/* ---------- small-screen notice ---------- */
#small{position:fixed;inset:0;z-index:99;display:none;place-items:center;padding:24px;text-align:center;background:var(--ink);color:var(--paper);font-size:16px;line-height:1.5}
#small b{font-family:var(--f-display);display:block;font-size:22px;margin-bottom:8px;color:var(--gold)}
@media (max-width:700px),(max-height:380px){#small{display:grid}}
 
/* ---------- NPC sprite ---------- */
#npc{position:absolute;left:50%;bottom:150px;width:330px;height:500px;transform:translateX(-50%);pointer-events:none;transition:opacity .45s, transform .45s}
#npc svg,#npc img{width:100%;height:100%;overflow:visible;object-fit:contain}
#npc.dissolve{opacity:0!important;filter:blur(10px);transform:translateX(-50%) scale(1.08);transition:all 1.6s}
#npc.off{opacity:0;transform:translateX(-50%) translateY(20px)}
#npc.ghost svg,#npc.ghost img{opacity:.62;filter:drop-shadow(0 0 22px rgba(170,220,255,.85));animation:flicker 3.2s infinite}
@keyframes flicker{0%,100%{opacity:.62}45%{opacity:.5}50%{opacity:.7}55%{opacity:.55}}
#npc.idle svg,#npc.idle img{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(3px) scaleY(.995)}}
 
/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:linear-gradient(180deg,rgba(11,15,27,.85),rgba(11,15,27,0));z-index:30;pointer-events:none}
#hud > *{pointer-events:auto}
#hud .score{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:96px;display:flex;align-items:center;gap:8px}
#hud .score small{font-family:var(--f-body);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(247,244,238,.6);font-weight:600}
#hud .chapter{flex:1;font-size:13px;letter-spacing:.06em;color:rgba(247,244,238,.85);font-weight:600;text-align:center}
.hbtn{height:34px;padding:0 14px;border-radius:17px;border:1px solid rgba(247,244,238,.25);background:rgba(20,27,46,.7);color:var(--paper);font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.hbtn:hover{border-color:var(--gold);color:#fff}
.hbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
#hud .plus{position:absolute;left:24px;top:46px;font-family:var(--f-display);font-weight:800;color:var(--gold);font-size:22px;pointer-events:none;animation:plus 1.4s ease-out forwards}
@keyframes plus{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
 
/* ---------- Task checklist ---------- */
#tasks{position:absolute;left:16px;top:62px;width:268px;background:rgba(247,244,238,.96);color:var(--ink);border-radius:6px 14px 14px 6px;padding:14px 14px 12px;z-index:25;box-shadow:0 10px 30px rgba(0,0,0,.35);border-left:5px solid var(--gold);transition:transform .5s cubic-bezier(.2,.9,.3,1.2)}
#tasks.out{transform:translateX(-320px)}
#tasks h4{margin:0 0 8px;font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-deep)}
#tasks ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#tasks li button{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:13px;line-height:1.3;color:var(--ink)}
#tasks li button:hover:not(:disabled){border-color:var(--patina);background:#f2faf7}
#tasks li button:disabled{cursor:default;opacity:.55}
#tasks li .box{width:18px;height:18px;border-radius:5px;border:2px solid var(--muted);display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
#tasks li.done .box{background:var(--patina);border-color:var(--patina);color:#fff}
#tasks li.done .t{text-decoration:line-through;color:var(--muted)}
#tasks li.opt .t::after{content:" · необов'язково";color:var(--muted);font-size:11px}
#tasks li .t small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
#tasks .hint{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.35}
 
/* ---------- Dialog ---------- */
#dialog{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:1060px;min-height:150px;background:rgba(20,27,46,.95);border:1px solid rgba(217,162,27,.5);border-radius:14px;padding:26px 30px 18px;z-index:40;box-shadow:0 16px 40px rgba(0,0,0,.5);cursor:pointer}
#dialog .who{position:absolute;top:-16px;left:26px;background:var(--gold);color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:14px;padding:6px 14px;border-radius:8px;letter-spacing:.02em}
#dialog .who:empty{display:none}
#dialog .text{font-size:21px;line-height:1.5;color:var(--paper);min-height:64px;max-width:62em;text-wrap:pretty}
#dialog .text.small{font-size:15px;font-style:italic;color:rgba(247,244,238,.8)}
#dialog .text.narr{color:rgba(247,244,238,.85);font-style:italic}
#dialog .next{position:absolute;right:20px;bottom:14px;background:none;border:none;color:var(--gold);font-weight:700;font-size:15px;animation:nudge 1.2s infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
#dialog .choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#dialog .choices button{text-align:left;font-size:17px;padding:11px 16px;border-radius:10px;border:1px solid rgba(247,244,238,.25);background:rgba(247,244,238,.06);color:var(--paper);display:flex;gap:12px;align-items:center}
#dialog .choices button:hover{background:rgba(217,162,27,.18);border-color:var(--gold)}
#dialog .choices button kbd{font-family:var(--f-display);font-size:12px;color:var(--gold);border:1px solid rgba(217,162,27,.6);border-radius:5px;padding:2px 7px}
#dialog .choices button.wrong{border-color:var(--brick);background:rgba(194,69,45,.18);animation:shake .35s}
#dialog .choices button.right{border-color:var(--patina);background:rgba(47,125,109,.35)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.voice-tag{display:inline-block;margin-left:8px;font-size:11px;color:var(--gold);opacity:.8;font-style:normal;vertical-align:middle}
 
/* ---------- Layer / panels ---------- */
#layer{position:absolute;inset:0;z-index:50;pointer-events:none}
#layer > *{pointer-events:auto}
.veil{position:absolute;inset:0;background:rgba(8,11,20,.62);display:grid;place-items:center;animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
.panel{background:var(--paper);color:var(--ink);border-radius:16px;box-shadow:0 30px 70px rgba(0,0,0,.5);position:relative}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}
.panel .sub{color:var(--muted);font-size:14px;margin:0 0 16px;line-height:1.45}
.panel .close{position:absolute;right:14px;top:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;color:var(--ink)}
.btn{border:none;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:700;background:var(--ink);color:var(--paper);display:inline-flex;gap:8px;align-items:center}
.btn:hover{background:var(--ink-2)}
.btn.gold{background:var(--gold);color:var(--ink)}
a.btn{text-decoration:none;justify-content:center}
.btn.gold:hover{background:#e8b232}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold-deep)}
.feedback{min-height:22px;font-size:14px;line-height:1.4;margin-top:10px;font-weight:600}
.feedback.bad{color:var(--brick)}
.feedback.ok{color:var(--patina)}
.speaker-hint{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.45;min-height:44px}
.speaker-hint .av{width:36px;height:36px;border-radius:50%;flex:none;overflow:hidden;background:var(--paper-2)}
.speaker-hint .av svg,.speaker-hint .av img{width:100%;height:100%;object-fit:contain}
.speaker-hint b{display:block;font-size:12px;color:var(--gold-deep)}
 
/* ---------- Toast ---------- */
#toast{position:absolute;right:18px;top:62px;z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;box-shadow:0 10px 26px rgba(0,0,0,.35);border-left:4px solid var(--patina);animation:toast 3.6s forwards;max-width:340px}
.toast.word{border-left-color:var(--gold)}
.toast.word b{font-family:var(--f-display);color:var(--gold-deep)}
@keyframes toast{0%{opacity:0;transform:translateX(30px)}8%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10px)}}
 
/* ---------- Title card ---------- */
#card{position:absolute;inset:0;z-index:80;display:grid;place-items:center;background:var(--ink);opacity:0;pointer-events:none;transition:opacity .7s}
#card.on{opacity:1;pointer-events:auto}
#card .in{text-align:center}
#card .eyebrow{color:var(--gold);font-size:13px}
#card h1{font-family:var(--f-display);font-weight:800;font-size:54px;line-height:1.1;margin:14px 0 0;color:var(--paper);text-wrap:balance;max-width:980px}
#fade{position:absolute;inset:0;z-index:85;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
#fade.on{opacity:1}
 
/* ---------- Title screen ---------- */
.title-ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:56px;gap:20px}
.logo{text-align:center;animation:logo 4s ease-in-out infinite;position:absolute;top:70px;left:0;right:0}
.logo .k{font-family:var(--f-display);font-weight:800;font-size:96px;letter-spacing:-.03em;color:var(--paper);line-height:.9;text-shadow:0 6px 40px rgba(217,162,27,.45)}
.logo .k span{color:var(--gold)}
.logo .s{font-size:14px;letter-spacing:.38em;text-transform:uppercase;color:rgba(247,244,238,.75);margin-top:14px;font-weight:600}
@keyframes logo{50%{transform:scale(1.025)}}
.title-ui .menu{display:flex;gap:12px}
.title-ui .menu .btn{min-width:170px;justify-content:center;font-size:16px;padding:14px 22px}
.title-ui .menu .btn.ghost{color:var(--paper);border-color:rgba(247,244,238,.35);background:rgba(20,27,46,.6)}
.title-ui .foot{font-size:12px;color:rgba(247,244,238,.5)}
.gate{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer;background:var(--ink);z-index:90}
.gate .in{text-align:center}
.gate .k{font-family:var(--f-display);font-weight:800;font-size:44px;color:var(--paper)}
.gate .k span{color:var(--gold)}
.gate p{color:rgba(247,244,238,.7);font-size:15px;margin-top:14px}
.gate .pulse{margin-top:28px;display:inline-block;padding:12px 26px;border-radius:30px;border:1px solid var(--gold);color:var(--gold);font-weight:700;animation:nudge 1.4s infinite}
 
/* ---------- Phone ---------- */
.phone{width:400px;height:660px;background:#0d111d;border-radius:44px;padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 2px #2b3350;position:relative}
.phone .scr{width:100%;height:100%;border-radius:32px;overflow:hidden;background:#e9eef5;display:flex;flex-direction:column;color:var(--ink)}
.phone .bar{height:64px;flex:none;background:#fff;display:flex;align-items:center;gap:10px;padding:18px 16px 0;border-bottom:1px solid #dde3ec}
.phone .bar .av{width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--paper-2);flex:none;display:grid;place-items:center;font-weight:800;font-size:13px}
.phone .bar .av svg,.phone .bar .av img{width:100%;height:100%;object-fit:contain}
.phone .bar b{font-size:15px;display:block}
.phone .bar small{font-size:11px;color:var(--muted)}
.phone .msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.msg{max-width:80%;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.4;background:#fff;align-self:flex-start;box-shadow:0 1px 1px rgba(0,0,0,.06);animation:pop .25s ease-out;word-wrap:break-word}
.msg .n{font-size:11px;font-weight:800;color:var(--patina);display:block;margin-bottom:2px}
.msg.me{align-self:flex-end;background:#d7f0e6}
.msg.sys{align-self:center;background:transparent;box-shadow:none;color:var(--muted);font-size:12px}
.msg.sticker{background:transparent;box-shadow:none;font-size:52px;padding:0;line-height:1}
.msg.typing{color:var(--muted);font-style:italic}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.phone .reply{flex:none;background:#fff;padding:10px;display:flex;flex-direction:column;gap:6px;border-top:1px solid #dde3ec;min-height:20px}
.phone .reply button{border:1px solid #cfd7e3;background:#f6f8fb;border-radius:14px;padding:9px 12px;font-size:13px;text-align:left;color:var(--ink)}
.phone .reply button:hover{border-color:var(--patina);background:#eef8f4}
.phone .notch{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:22px;background:#0d111d;border-radius:12px;z-index:2}
 
/* ---------- Profile / ticket ---------- */
.profile{width:900px;padding:30px 34px;display:grid;grid-template-columns:1fr 300px;gap:30px}
.profile .fields{display:flex;flex-direction:column;gap:14px;min-width:0}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid #cfc8b8;background:#fff;color:var(--ink)}
.field .err{font-size:12px;color:var(--brick);margin-top:4px;min-height:16px}
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avatars button{aspect-ratio:1;border-radius:12px;border:2px solid transparent;background:#fff;padding:2px;overflow:hidden}
.avatars button svg,.avatars button img{width:100%;height:100%;object-fit:contain}
.avatars button[aria-pressed="true"]{border-color:var(--gold);background:#fff7e3}
.preview{background:var(--ink);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:12px;position:relative;overflow:hidden}
.preview canvas{position:static!important;width:240px;height:300px}
.preview .lbl{color:rgba(247,244,238,.7);font-size:12px;margin-top:6px}
.ticket-wrap{width:560px;height:420px;position:relative;display:grid;place-items:start center}
.printer{width:600px;height:70px;background:#2b3350;border-radius:14px 14px 4px 4px;position:relative;z-index:2;box-shadow:0 10px 0 #1b2135}
.printer::after{content:"";position:absolute;left:40px;right:40px;bottom:10px;height:8px;background:#0b0f1b;border-radius:4px}
.ticket-clip{width:520px;height:330px;overflow:hidden;margin-top:-10px;position:relative}
.ticket{width:500px;height:310px;margin:0 auto;background:linear-gradient(135deg,#fdfbf6,#f2ead6);border-radius:12px;box-shadow:0 10px 20px rgba(0,0,0,.35);transform:translateY(-330px);padding:20px 22px;box-sizing:border-box;color:var(--ink);display:grid;grid-template-columns:120px 1fr;gap:18px;border-top:10px solid var(--patina);position:relative}
.ticket.print{animation:print 2.6s steps(26) forwards}
@keyframes print{to{transform:translateY(0)}}
.ticket .ph{width:120px;height:150px;background:var(--paper-2);border-radius:8px;overflow:hidden}
.ticket .ph svg,.ticket .ph img{width:100%;height:100%;object-fit:contain}
.ticket h3{margin:0;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--patina)}
.ticket .nm{font-family:var(--f-display);font-size:24px;font-weight:700;margin:6px 0 10px;line-height:1.1}
.ticket dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px}
.ticket dt{color:var(--muted)}
.ticket dd{margin:0;font-weight:600}
.ticket .num{position:absolute;right:20px;bottom:16px;font-size:11px;letter-spacing:.2em;color:var(--muted);font-variant-numeric:tabular-nums}
 
/* ---------- Drag & drop ---------- */
.dd{width:1000px;padding:28px 32px}
.dd-grid{display:grid;grid-template-columns:260px 1fr;gap:28px;margin-top:4px}
.cards{display:flex;flex-direction:column;gap:10px;min-height:400px}
.card{background:var(--ink);color:var(--paper);border-radius:10px;padding:12px 14px;font-family:var(--f-display);font-weight:700;font-size:16px;cursor:grab;touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.25);position:relative;z-index:1}
.card.drag{cursor:grabbing;z-index:20;box-shadow:0 14px 30px rgba(0,0,0,.35);transition:none}
.card.back{transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.card.placed{background:var(--patina);cursor:default;box-shadow:none}
.slots{display:flex;flex-direction:column;gap:10px}
.slot{border:2px dashed #c7bfae;border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;min-height:30px;background:#fff;font-size:15px;line-height:1.35}
.slot .drop{min-height:30px;border-radius:8px;background:var(--paper-2);display:flex;align-items:center;font-family:var(--f-display);font-size:14px;font-weight:700;padding:4px 10px;color:var(--muted)}
.slot.hover{border-color:var(--gold);background:#fff9e8}
.slot.ok{border-style:solid;border-color:var(--patina)}
.slot.ok .drop{background:var(--patina);color:#fff}
 
/* timeline */
.tl{width:1120px;padding:26px 30px}
.tl-pool{display:flex;gap:10px;flex-wrap:wrap;min-height:120px;align-items:flex-start;margin:6px 0 18px}
.tl-pool .card{width:196px;font-family:var(--f-body);font-weight:600;font-size:13px;line-height:1.35;padding:10px 12px}
.tl-line{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;position:relative;padding-top:26px}
.tl-line::before{content:"";position:absolute;left:0;right:0;top:10px;height:4px;background:linear-gradient(90deg,var(--gold-deep),var(--gold));border-radius:2px}
.tl-line::after{content:"раніше → пізніше";position:absolute;right:0;top:-12px;font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;font-weight:700}
.tl-slot{min-height:110px;border:2px dashed #c7bfae;border-radius:10px;background:#fff;position:relative;display:flex;flex-direction:column;padding:6px}
.tl-slot::before{content:"";position:absolute;top:-22px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--gold-deep);transform:translateX(-50%)}
.tl-slot .yr{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--patina);text-align:center;min-height:24px}
.tl-slot.hover{border-color:var(--gold);background:#fff9e8}
.tl-slot .card{width:auto;font-family:var(--f-body);font-weight:600;font-size:13px;line-height:1.35;padding:10px 12px}
.tl-slot .card.locked{background:var(--patina);cursor:default}
 
/* quiz panel */
.quiz{width:760px;padding:28px 32px}
.quiz .q{font-size:20px;font-weight:700;margin:6px 0 14px;line-height:1.35;text-wrap:balance}
.quiz .opts{display:flex;flex-direction:column;gap:8px}

.photo{width:720px;padding:26px 30px}

  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

/* Звання — чиста функція від суми балів */
function rank(score) {
  for (const r of DATA.ranks) if (score >= r.min) return r;
  return DATA.ranks[DATA.ranks.length - 1];
}
 

/* =========================================================
   Основний звук — файли в assets/music, assets/sfx, assets/ambience.
   Синтез лишився як резерв. Файли озвучки — assets/voice.
   Шум для резервного синтезу генерується
   детермінованим ГПВЧ (seeded), без Math.random().
   ========================================================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
 
const Sound = (() => {
  let ctx = null, master, musicBus, sfxBus, ambBus, voiceBus;
  let enabled = true;
  let noiseBuf = null;
  const fileOk = {};          // name -> true/false (чи є файл)
  let music = null;           // {name, timer, nodes, el}
  let amb = null;
 
  const NOTE = { C: 0, "C#": 1, Db: 1, D: 2, "D#": 3, Eb: 3, E: 4, F: 5, "F#": 6, Gb: 6, G: 7, "G#": 8, Ab: 8, A: 9, "A#": 10, Bb: 10, B: 11 };

    master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
    musicBus = ctx.createGain(); musicBus.gain.value = 0.32; musicBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.6; sfxBus.connect(master);
    ambBus = ctx.createGain(); ambBus.gain.value = 0.35; ambBus.connect(master);
    voiceBus = ctx.createGain(); voiceBus.gain.value = 0.18; voiceBus.connect(master);

    for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1;
    ["click", "ok", "err", "notif", "word", "print", "bell", "step", "paper", "shh", "stamp", "pop", "whoosh", "door", "vibrate", "sparkle", "chime"].forEach(n => probe("assets/sfx/" + n + ".mp3", ok => { fileOk["sfx_" + n] = ok; }));
  }
 
  function tone(freq, t, dur, { type = "sine", gain = 0.2, dest = sfxBus, attack = 0.01, release = 0.08, detune = 0, slide = 0 } = {}) {

/** subs: [[від, до, текст], ...] у секундах. draw(ctx, t, dur). */
function playVideo({ id, dur, draw, subs = [], skippable = true, vertical = false, voice }) {

    const cv = $("canvas", v), ctx = cv.getContext("2d"), sub = $(".subs span", v), prog = $(".prog", v);
    const speed = FAST ? 40 : 1;
    let t0 = performance.now(), done = false, videoEl = null, lastSub = -1;
    if (voice) Sound.voice(voice);
    const finish = () => { if (done) return; done = true; pop(); Sound.stopVoice(); if (videoEl) videoEl.pause(); closeLayer(v); res(); };
    const pop = pushKeys(e => { if (skippable && (e.key === "Escape" || e.key === "Enter")) { finish(); return true; } });
    if (skippable) $("#vskip", v).addEventListener("click", finish);
    // MP4 слот
    if (id && !FAST) {
      const vid = document.createElement("video"); vid.playsInline = true; vid.src = "assets/video/" + id + ".mp4";
      vid.addEventListener("loadeddata", () => { if (done) return; videoEl = vid; cv.replaceWith(vid); vid.play().catch(() => {}); vid.onended = finish; }, { once: true });
      vid.addEventListener("error", () => {}, { once: true });
    }
    (function loop(now) {
      if (done) return;
      const t = videoEl ? videoEl.currentTime : (now - t0) / 1000 * speed;
      if (!videoEl) draw(ctx, t, dur);
      prog.style.width = Math.min(100, t / dur * 100) + "%";

      if (k !== lastSub) { lastSub = k; sub.textContent = k >= 0 ? tpl(subs[k][2]) : ""; sub.style.display = k >= 0 ? "" : "none"; }
      if (t >= dur && !videoEl) { finish(); return; }
      requestAnimationFrame(loop);
    })(t0);
  });
}

/* ---------- Drag & drop helper (pointer events, працює зі scale) ---------- */
function draggable(card, { targets, onDrop }) {
  card.addEventListener("pointerdown", e => {
    if (card.classList.contains("placed") || card.classList.contains("locked")) return;
    e.preventDefault(); card.setPointerCapture(e.pointerId);
    const sx = e.clientX, sy = e.clientY;
    card.classList.add("drag"); card.classList.remove("back");
    let over = null;
    const move = ev => {
      card.style.transform = `translate(${(ev.clientX - sx) / SCALE}px,${(ev.clientY - sy) / SCALE}px) rotate(-2deg)`;
      const hit = targets().find(t => { const r = t.getBoundingClientRect(); return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom; });
      if (over !== hit) { over && over.classList.remove("hover"); over = hit; over && over.classList.add("hover"); }
    };
    const up = () => {
      card.removeEventListener("pointermove", move); card.removeEventListener("pointerup", up); card.removeEventListener("pointercancel", up);
      card.classList.remove("drag"); over && over.classList.remove("hover");
      const accepted = over ? onDrop(card, over) : false;
      if (!accepted) { card.classList.add("back"); card.style.transform = ""; }
    };
    card.addEventListener("pointermove", move); card.addEventListener("pointerup", up); card.addEventListener("pointercancel", up);
  });
}

function slangGame() {
  return new Promise(res => {
    const words = DATA.slang.words, byId = Object.fromEntries(words.map(w => [w.id, w]));
    const v = openLayer(`<div class="panel dd"><div class="eyebrow">Глава 1 · міні-гра</div><h2>Сленг-перекладач</h2>
      <p class="sub">Перетягни кожне слово на його значення. Правильна картка з першої спроби — +10, з наступної — +5.</p>

      <div class="slots">${DATA.slang.defsOrder.map(id => `<div class="slot" data-id="${id}"><div class="drop">?</div><div>${esc(byId[id].def)}</div></div>`).join("")}</div></div>

function panelQuiz(root, items, { who, keyPrefix, onDone, qSel = ".qz" }) {
  return new Promise(res => {
    const box = $(qSel, root);
    let qi = 0;
    const render = () => {
      const it = items[qi]; let tries = 0;
      box.innerHTML = `<div class="quiz" style="width:auto;padding:0"><div class="prog">${items.map((_, i) => `<i class="${i <= qi ? "on" : ""}"></i>`).join("")}</div>
        <div class="q">${esc(tpl(it.q))}</div><div class="opts">${it.o.map((o, i) => `<button data-i="${i}" ${TEST && i === it.a ? 'data-ok="1"' : ""}><kbd>${i + 1}</kbd>${esc(o)}</button>`).join("")}</div><div class="feedback"></div></div>`;
      const fb = $(".feedback", box);
      $$(".opts button", box).forEach(b => b.addEventListener("click", () => {
        const i = +b.dataset.i;
        if (i === it.a) {
          b.classList.add("right"); $$(".opts button", box).forEach(x => x.disabled = true);
          award(keyPrefix + qi, tries ? 5 : 10); Sound.sfx("ok");
          fb.className = "feedback ok"; fb.textContent = it.ok || "Правильно!";
          if (who) setHint(root, who, it.ok || "Так, усе правильно!", "happy");

        } else {

          fb.className = "feedback bad"; fb.textContent = it.why || "Не зовсім. Спробуй ще раз.";
          if (who) setHint(root, who, it.why || "Спробуй ще раз.", "surprised");
        }

    };
    render();
  });
}

    subs: [[1, 6, "Петрович киває: «Молодець, першокурснику»"], [7, 12, "Дана махає телефоном: «Ти в чатику — назавжди»"], [13, 18, "Пані Ольга усміхається: «ІНП без жодної помилки»"], [19, 24, "У вікні Староакадемічного майорить Сковорода"],
      [25, 31, "Мар'яна: «Ти більше не фреш-новачок. Тебе хочуть бачити…»"], [32, 40, "Президент Академії: «{name}, ви пройшли шлях, який проходить кожен могилянець. Вітаю в Академії — тепер це і ваш дім»."], [40.5, 45, "Вручення сертифіката"]],
    draw(ctx, t) {
      ctx.save(); const pan = Math.min(1, t / 24); ctx.translate(-pan * 180, 0); ctx.scale(1.15, 1.15); BG.yardFest(ctx, t); ctx.restore();
      const seg = [[0, 6, "guard", 300], [6, 12, "dana", 520], [12, 18, "olga", 760], [24, 32, "maryana", 640], [32, 45, "president", 760]];
      seg.forEach(([a, b, id, x]) => { if (t >= a && t < b) { const k = Math.min(1, (t - a) / .6), out = Math.max(0, (t - b + .6) / .6); ctx.globalAlpha = Math.max(0, k - out); const bob = id === "guard" ? Math.abs(Math.sin(t * 3)) * 10 : id === "dana" ? Math.sin(t * 8) * 4 : 0; ctx.drawImage(im(id), x - 150, 260 + bob, 300, 460); ctx.globalAlpha = 1; if (id === "dana") { ctx.save(); ctx.translate(x + 120, 420); ctx.rotate(Math.sin(t * 8) * .4); ctx.fillStyle = "#141b2e"; rr(ctx, -18, -34, 36, 64, 6); ctx.fill(); ctx.restore(); } } });
      if (t >= 18 && t < 24) { ctx.globalAlpha = .55 + Math.sin(t * 5) * .1; ctx.drawImage(im("skovoroda"), 860, 150, 160, 245); ctx.globalAlpha = 1; }
      if (t >= 32) { ctx.drawImage(av, 220, 300, 270, 414); }
      if (t >= 40) { const k = Math.min(1, (t - 40) / 1.5); ctx.save(); ctx.translate(500 + 100 * (1 - k), 470); ctx.rotate(-0.1); ctx.fillStyle = "#f7f4ee"; ctx.fillRect(-90, -60, 180, 120); ctx.strokeStyle = "#d9a21b"; ctx.lineWidth = 5; ctx.strokeRect(-82, -52, 164, 104); ctx.fillStyle = "#141b2e"; ctx.font = "800 16px Unbounded, sans-serif"; ctx.textAlign = "center"; ctx.fillText("СЕРТИФІКАТ", 0, 0); ctx.restore(); }
      if (t >= 41 && !confettiDone) { confettiDone = true; confetti(3800); }
    } });
}
async function final() {
  setChapter("Фінал"); showHUD(true); hideTasks(); MapView.hide(); hideNPC(); hideDialog();
  Sound.stopAmb(); Sound.startMusic("theme_triumph");
  await finalCutscene();
  if (!S.finishedAt) S.finishedAt = Date.now();
  save("done");
  await certificateScreen();
}
async function certificateScreen() {
  setBg("yardFest"); showHUD(true); setChapter("Фінал · сертифікат"); hideNPC(); hideDialog(); hideTasks(); MapView.hide();
  Sound.startMusic("theme_triumph");
  const url = await makeCertificate();
  const r = rank(score());
  const fname = "KMA-Quest-" + S.player.name.replace(/[^\wа-яіїєґ'-]/gi, "_") + ".png";
  const v = openLayer(`<div class="panel cert"><div><img src="${url}" alt="Сертифікат ${esc(S.player.name)}"></div>
    <div class="side"><div class="eyebrow">Твоє звання</div><div class="rank">${esc(r.title)}</div><div class="pts">${score()} балів з 380 · штампів СО: ${S.stamps.length} з 4</div>
    ${hintBox("maryana", r.line)}
    <a class="btn gold" href="${url}" download="${esc(fname)}" id="dl">⬇ Завантажити сертифікат</a>
    <p class="note">Якщо завантаження не почалося, клацни правою кнопкою на сертифікаті → «Зберегти зображення як…».</p>
    <button class="btn ghost" id="nb">Відкрити Нотатник фреша</button>
    <button class="btn ghost" id="cr">Титри</button>
    <button class="btn" id="again">Грати ще раз</button></div></div>`);
  $("#dl", v).onclick = async e => {
    Sound.sfx("ok");
    if (!window.claude || !window.claude.use) return; // звичайне завантаження за посиланням
    e.preventDefault();
    const fallback = "Клацни правою кнопкою на сертифікаті → «Зберегти зображення як…».";
    try {
      const d = await window.claude.use("downloads");
      if (!d) { toast(fallback); return; }
      const bin = atob(url.split(",")[1]), arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      await d.save({ filename: fname, data: new Blob([arr], { type: "image/png" }) });
      toast("Сертифікат збережено");
    } catch (err) { if (!err || err.code !== "declined") toast("Не вдалося зберегти. " + fallback); }
  };
  $("#nb", v).onclick = () => openNotebook();
  $("#cr", v).onclick = () => credits();
  return new Promise(res => { $("#again", v).onclick = () => { closeLayer(v); storeDel(SAVE_KEY); S = freshState(); res("restart"); }; });
}
function credits() {
  return new Promise(res => {
    Sound.startMusic("theme_campus");
    const v = openLayer(`<canvas width="${W}" height="${H}"></canvas><div class="roll"><div class="big">KMA Quest</div><p>Квест для першокурсників Могилянки</p>
      ${DATA.credits.map(([a, b]) => `<h3>${esc(a)}</h3><p>${esc(b)}</p>`).join("")}<h3>Дякуємо, що зіграли</h3><p class="big" style="font-size:40px">${esc(S.player.name || "")}, ласкаво просимо додому</p></div>
      <div class="ctl"><button class="skip" id="cx" style="background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:18px;padding:7px 16px">Закрити</button></div>`, "credits");
    const ctx = $("canvas", v).getContext("2d"); let run = true; const t0 = performance.now();
    (function f(now) { if (!run) return; BG.yardDay(ctx, (now - t0) / 1000); requestAnimationFrame(f); })(t0);
    const close = () => { run = false; closeLayer(v); Sound.startMusic("theme_triumph"); res(); };
    $("#cx", v).onclick = close; setTimeout(() => { if (run) close(); }, FAST ? 100 : 36000);
  });
}
 
/* ---------- Запуск ---------- */
async function runFrom(scene) {
  const idx = ORDER.indexOf(scene);
  const at = k => idx <= ORDER.indexOf(k);
  if (at("prologue")) await prologue();
  if (at("ch1")) await ch1Intro();
  if (at("ch1_hub")) await ch1Hub();
  if (at("ch2")) await ch2();
  if (at("ch3")) await ch3();
  if (at("ch3_hub")) await ch3Hub();
  if (at("ch4")) await ch4();
  if (at("club")) await clubScene();
  if (at("final")) await final();
  else if (scene === "done") await certificateScreen();
}
async function boot() {
  fit(); requestAnimationFrame(bgLoop);
  $("#snd").onclick = () => { Sound.setEnabled(!Sound.enabled); updateHUD(); };
  $("#nbBtn").onclick = () => openNotebook();
  setBg("title");
  try { await document.fonts.ready; } catch (e) {}
  if (!TEST) await gate(); else Sound.init();
  while (true) {
    const scene = await titleScreen();
    await runFrom(scene);
    hideTasks(); hideDialog(); hideNPC(); MapView.hide(); $("#layer").innerHTML = "";
  }
}
window.__kma = { get S() { return S; }, score, rank, enter: id => MapView.enterForTest(id), solve: () => window.__solve && window.__solve(), task: id => { if (taskResolver) { const r = taskResolver; taskResolver = null; r(id); } } };
boot();
 

</script>
